      D: {
        rukou: { ll: [100, 800], n: 'Điểm Giao Thoa Hỗn Độn · Lối vào Ảo Tưởng Hương', l: 'Khu cửa vào · Điểm hợp lưu', c: '#fbbf24', i: '🌀', p: 'Giao giới giữa thế giới chủ cán và Ảo Tưởng Hương, điểm truyền tống của Chaldea', a: 'Hoa anh đào rơi ở đây nhưng vĩnh viễn không chạm đất; cánh hoa treo giữa không trung như bị thời gian đóng băng. Ánh sáng có màu hồng nhạt, không phải ánh mặt trời mà là hào quang thấm ra từ nơi sâu trong ranh giới.', f: 'Khiên của Mash bắt đầu rung khi tiến vào khu vực này, mặt khiên nóng lên: tín hiệu đầu tiên cho thấy mảnh vỡ nhân lý cộng hưởng với Master.', d: 'Trung bình · Ranh giới giao hội', o: 'Cảnh mở đầu. Master rơi từ cửa hợp lưu xuống trước hòm công đức của Đền Hakurei. Mash không thể tiến vào Ảo Tưởng Hương; sự tồn tại của nàng sẽ bị pháp tắc sắc dục khóa chặt, nên phải ở lại ngoài ranh giới làm neo.', img: 'https://img.z4a.net/images/2026/06/30/1f8ca8705ebfcc529.webp' },
        shenshe: { ll: [150, 800], n: 'Đền Hakurei', l: 'Chương 1 · Khu khởi đầu', c: '#10b981', i: '⛩️', p: 'Khu vực khởi đầu của Ảo Tưởng Hương, điểm Master đáp xuống', a: 'Hiên đền có hơi ấm lười biếng, trong không khí lơ lửng hoa anh đào. Đó không phải hoa anh đào bình thường, mà là những cánh hồng có thể hô hấp, nằm giữa thực vật và làn da. Trước hòm công đức, tiếng đồng xu vang rỗng; không phải tiếng kim loại, mà là âm trầm đã bị khát vọng ngâm thấm.', f: 'Hakurei Reimu là người miễn nhiễm tự nhiên: mảnh vỡ không xuyên qua được bức tường vô dục của nàng. Khốn cảnh của nàng không phải "bị loại trừ", mà là "không thể hiểu khát vọng"; nàng chứng kiến dục vọng của tất cả mọi người nhưng không cảm nhận được dục vọng của chính mình.', d: 'Thấp · Tương đối an toàn', o: 'Cảnh cốt lõi chương 1, cũng là cảnh chia tay chung chương. Reimu, với tư cách người miễn nhiễm tự nhiên, là cửa sổ đầu tiên để Master hiểu pháp tắc sắc dục. Trong chung chương, Reimu pha trà nóng tại đây; trong hòm công đức có vị trí của Master. Đó là chuyển biến rất tinh tế từ "vô dục" sang "thử khát vọng".', img: 'https://img.z4a.net/images/2026/06/30/14bea8842f47e95a6.webp' },
        mofa: { ll: [180, 720], n: 'Rừng Ma Pháp', l: 'Chương 1 · Khu rừng', c: '#10b981', i: '🌲', p: 'Xung quanh Đền Hakurei, nơi Kirisame Marisa sống một mình', a: 'Trong sâu khu rừng có nấm và sách ma pháp; căn nhà nhỏ của Marisa ẩn giữa cây cối. Cây rừng bị pháp tắc sắc dục thấm vào, vỏ cây ấm, chạm vào giống làn da. Nấm đang hô hấp, bào tử có màu hồng.', f: 'Kirisame Marisa là kẻ chiếm hữu kiểu cướp đoạt. Dưới sự thấm nhiễm của pháp tắc sắc dục, Master Spark biến thành một luồng sáng hồng. Vết răng lưu trên cổ tay Master là hình thái sắc dục của "chiếm hữu".', d: 'Trung bình · Chiến đấu danmaku', o: 'Cảnh chương 1. Master và Marisa giao chiến danmaku trong sâu rừng. Sau trận, Marisa không bị đánh bại; nàng chủ động chọn đầu hàng, bởi dưới pháp tắc sắc dục, "cướp đoạt" đã biến thành "được lấp đầy".', img: 'https://img.z4a.net/images/2026/06/30/12bf592340e73e79c.webp' },
        wuzhi: { ll: [200, 680], n: 'Hồ Sương', l: 'Chương 1 · Khu hồ', c: '#06b6d4', i: '💧', p: 'Rìa Rừng Ma Pháp, phạm vi hoạt động của Cirno', a: 'Nước hồ lạnh, nhưng dưới ảnh hưởng của mảnh vỡ lại trở nên ấm. Sương lang thang trên mặt hồ như hơi thở không tan. Dưới đáy hồ có ánh sáng, không phải phản chiếu, mà là thứ gì đó đang chờ đợi.', f: 'Cirno: hình thái sắc dục của băng tinh là trao đổi nhiệt độ; trong cơ thể nàng nóng lạnh luân phiên. Giao hợp là lần đầu tiên nàng cảm nhận trải nghiệm "được hơi ấm lấp đầy".', d: 'Trung bình · Dị biến nhiệt độ', o: 'Cảnh chương 1. Sự giao hòa băng lạnh của Cirno, thu thập mảnh vỡ nhiệt độ và bóng tối. Ranh giới giữa băng và lửa tan ra trong giao hợp.', img: 'https://img.z4a.net/images/2026/06/30/14572baff28339b4f.webp' },
        senlin: { ll: [220, 640], n: 'Rìa Rừng', l: 'Chương 1 · Khu hoàng hôn', c: '#8b5cf6', i: '🌑', p: 'Giao giới giữa Rừng Ma Pháp và Hồ Sương, lúc hoàng hôn', a: 'Ánh hoàng hôn đỏ nhạt màu da thịt, như được nhuộm bằng thân nhiệt. Bóng tối lan ra từ sâu trong rừng, đó là lãnh vực của Rumia. Bóng tối không trống rỗng, mà "quá đầy", đầy đến mức không thể nhìn thấy.', f: 'Rumia: bóng tối là bộ khuếch đại xúc giác. Trong giao hợp, bóng tối khiến mỗi lần chạm đều đồng thời xảy ra từ bốn phương tám hướng.', d: 'Trung bình · Lãnh vực bóng tối', o: 'Cảnh chương 1. Bóng tối của Rumia nuốt lấy, thu thập mảnh vỡ nhiệt độ và bóng tối. Xúc giác trong bóng tối bị phóng đại vô hạn.', img: 'https://img.z4a.net/images/2026/06/30/10d50f8c98f6811c4.webp' },
        hongmo: { ll: [320, 900], n: 'Hồng Ma Quán', l: 'Chương 2 · Khu hiến tế cao quý', c: '#dc2626', i: '🧛', p: 'Phía tây Ảo Tưởng Hương, lãnh địa của ma cà rồng', a: 'Lãnh địa ma cà rồng đã năm trăm năm chưa từng được loài người khát vọng. Cường độ ảnh hưởng của mảnh vỡ gấp ba lần Đền Hakurei. Kiến trúc kiểu Gothic, tường ngoài màu đỏ dưới pháp tắc sắc dục đã biến thành sắc đỏ sẫm màu thịt. Mắt trong tranh treo hành lang sẽ nhìn theo Master.', f: 'Meiling, Patchouli, Sakuya, Remilia và Flandre: năm lớp phòng tuyến lần lượt bị vượt qua. Không phải đánh bại, mà là tiếp nhận. Tất cả đều tự mình lựa chọn.', d: 'Cao · Ảnh hưởng mảnh vỡ gấp ba', o: 'Cảnh cốt lõi chương 2. Meiling vượt qua ngưỡng cửa, Patchouli kiểm chứng tri thức, nghi thức dừng thời gian giây thứ 301 của Sakuya, sự sụp đổ của kẻ cao quý Remilia, Flandre chạm vào mà không phá hủy.', img: 'https://img.z4a.net/images/2026/06/30/15142a1bcf0fbed02.webp' },
        baiyu: { ll: [420, 700], n: 'Bạch Ngọc Lâu', l: 'Chương 3 · Khu Minh giới', c: '#8b5cf6', i: '🌸', p: 'Minh giới, nơi Tây Hành Yêu tọa lạc', a: 'Nước sông Tam Đồ ấm như thân nhiệt. Cây anh đào Bạch Ngọc Lâu vĩnh viễn ở trạng thái "sắp nở", cánh hoa đang hô hấp. Ánh nắng của Minh giới không đến từ bầu trời, mà là sắc vàng nhạt thấm lên từ lòng đất.', f: 'Saigyouji Yuyuko: hư vô tiêu hóa nhiệt độ, "lần đầu cảm thấy no". Konpaku Youmu: sự xé rách của trung thành, "ngươi có thể đồng thời là hai thứ".', d: 'Trung bình · Lãnh vực Minh giới', o: 'Nửa đầu chương 3. Hư vô của Yuyuko tiêu hóa nhiệt độ, sự trung thành của Youmu bị xé rách. Rễ Tây Hành Yêu quấn lấy mảnh vỡ.', img: 'https://img.z4a.net/images/2026/06/30/16a0170fbe6842764.webp' },
        diling: { ll: [450, 780], n: 'Điện Địa Linh', l: 'Chương 3 · Khu Địa Ngục cũ', c: '#8b5cf6', i: '🔥', p: 'Địa Ngục cũ, phía trên di chỉ Địa Ngục Nóng Bỏng', a: 'Di chỉ Địa Ngục Nóng Bỏng do Satori quản lý bằng đọc tâm. Hành lang Điện Địa Linh ấm hơn phòng, đó là vô thức của Koishi đang thấm vào không gian. Lửa ở Địa Ngục cũ có màu hồng, không phải đang cháy, mà là một thứ gì đó đang chờ đợi.', f: 'Komeiji Satori: người đọc tâm chọn nhắm mắt. Không phải từ bỏ năng lực, mà là chọn tin tưởng. Komeiji Koishi: "quên nhưng thân thể ghi nhớ" là biểu hiện kỳ dị nhất của pháp tắc sắc dục.', d: 'Cao · Lãnh vực đọc tâm', o: 'Nửa sau chương 3. Sự im lặng của người đọc tâm Satori, sự thành thật của thân thể trong vô thức Koishi. Master bị ép nói ra chân tướng trong cuộc chiến tâm lý của Satori: "Có người đang đợi tôi trở về".', img: 'https://img.z4a.net/images/2026/06/30/1e857437baf1b34d4.webp' },
        yongyuan: { ll: [520, 880], n: 'Vĩnh Viễn Đình', l: 'Chương 4 · Khu vĩnh hằng', c: '#06b6d4', i: '🎋', p: 'Sâu trong rừng trúc lạc lối, nơi ở của người Mặt Trăng', a: 'Trúc biến thành sắc hồng nhạt màu da, giữa các đốt có dịch ấm tiết ra. Mái Vĩnh Viễn Đình mọc đầy sợi nấm nhịp động như đang hô hấp. Rừng trúc mãi ở trạng thái "sắp lạc đường"; không phải thật sự lạc đường, mà là vĩnh viễn không tìm được lối ra.', f: 'Kaguya, Mokou, Reisen và Eirin đều đang chống lại "vĩnh viễn": Kaguya dùng vòng lặp thời gian, Mokou dùng bất tử, Reisen dùng vô cấu, Eirin dùng tính toán. Master là người đầu tiên dạy họ "kết thúc".', d: 'Cao · Lãnh vực vĩnh viễn', o: 'Cảnh cốt lõi chương 4. Phá vỡ "vĩnh viễn" trong bẫy thời gian của Kaguya, vòng lặp thiêu đốt và tái sinh của Mokou, sự phóng thích cuồng khí của Reisen, sự sụp đổ tính toán của Eirin.', img: 'https://img.z4a.net/images/2026/06/30/1e60158c087b105c9.webp' },
        shouye: { ll: [600, 700], n: 'Đền Moriya', l: 'Chương 5 · Khu tín ngưỡng', c: '#fbbf24', i: '⛩️', p: 'Chân Núi Yêu Quái, nơi ở của thần linh', a: 'Cổng torii biến thành đỏ sẫm màu máu, bề mặt có dịch ấm. Thần linh trải nghiệm sự đảo ngược của "được khát vọng" tại đây. Nước suối trong đền ấm như được thân nhiệt ủ nóng.', f: 'Kochiya Sanae: kỳ tích mất hiệu lực, "ấm hơn cả tín ngưỡng". Moriya Suwako: ký ức hồi phục trong trận ngự trụ, "đã lâu lắm không nghe thấy tên của mình".', d: 'Trung bình · Lãnh vực tín ngưỡng', o: 'Nửa đầu chương 5. Tín ngưỡng của Sanae sụp đổ, Suwako lột xác. Thần linh trải nghiệm sự đảo ngược của "được khát vọng": từ "được tín ngưỡng" đến "được cần đến".', img: 'https://img.z4a.net/images/2026/06/30/179d8929a515022dd.webp' },
        yaoguai: { ll: [630, 760], n: 'Núi Yêu Quái', l: 'Chương 5 · Khu núi', c: '#60a5fa', i: '⛰️', p: 'Phía sau Đền Moriya, lãnh địa của tengu và kappa', a: 'Đá ở sườn núi là nơi của Aya, gió núi ấm. Trạm gác là nơi Momiji canh giữ; người mãi mãi canh giữ là người khao khát được bảo vệ nhất. Nước thác núi ấm như nước mắt.', f: 'Shameimaru Aya: chụp vô số người nhưng chưa từng chụp chính mình. Đặt máy ảnh xuống là lần đầu nàng trở thành người được ghi lại. Inubashiri Momiji: người mãi mãi canh giữ là người khao khát được bảo vệ nhất.', d: 'Trung bình · Lãnh vực trong núi', o: 'Cảnh giữa chương 5. Người quan sát Aya tham dự, lính gác Momiji bàn giao vị trí. "Ghi chép" của tengu dưới pháp tắc sắc dục biến thành "được ghi chép".', img: 'https://img.z4a.net/images/2026/06/30/182c77163649ebd85.webp' },
        shenpan: { ll: [660, 820], n: 'Pháp Đình', l: 'Chương 5 · Khu phán xét', c: '#dc2626', i: '⚖️', p: 'Giao giới giữa Ảo Tưởng Hương và địa ngục, lãnh vực của Shiki Eiki', a: 'Tấm gương trong pháp đình là Tịnh Pha Lê Chi Kính, soi ra mọi tội lỗi. Dưới pháp tắc sắc dục, gương bắt đầu nứt: không phải bị đập vỡ, mà tự vỡ khi người phán xét thừa nhận mình có tội.', f: 'Shiki Eiki: Tịnh Pha Lê Chi Kính xuất hiện vết nứt không phải vì bị đánh vỡ, mà vì người phán xét thừa nhận mình có tội. Đó là khởi đầu của sự lung lay nơi cái "tuyệt đối".', d: 'Cao · Lãnh vực phán xét', o: 'Cảnh cốt lõi chương 5. Sự đảo ngược trong phán xét của Eiki. Người phán xét thừa nhận mình có tội, chiếc gương tự nứt. Đây là khởi đầu của cái "tuyệt đối" bị lung lay.', img: 'https://img.z4a.net/images/2026/06/30/1935039f0ab595dac.webp' },
        youding: { ll: [720, 850], n: 'Hữu Đỉnh Thiên', l: 'Chương 6 · Khu Thiên giới', c: '#fbbf24', i: '☁️', p: 'Thiên giới, nơi ở của Hinanawi Tenshi', a: 'Động đất ở Thiên giới ngày càng thường xuyên, đó là con của trời đang trút giận. Mây ở Hữu Đỉnh Thiên ấm như bông được ủ bằng thân nhiệt. Ánh nắng Thiên giới màu vàng nhạt, nhưng không phải mặt trời, mà là ánh sáng thấm ra từ ranh giới.', f: 'Hinanawi Tenshi: Phi Tưởng Chi Kiếm mất kiểm soát, "không hoàn hảo lại thoải mái đến vậy". Giao hợp là rơi xuống: sự rơi xuống của thiên nhân.', d: 'Trung bình · Lãnh vực Thiên giới', o: 'Nửa đầu chương 6. Tenshi từ thiên nhân rơi xuống, kiêu ngạo tan rã. Dưới pháp tắc sắc dục, Phi Tưởng Chi Kiếm biến thành ánh sáng hồng.', img: 'https://img.z4a.net/images/2026/06/30/16278164213362ac1.webp' },
        jiuyan: { ll: [740, 780], n: 'Nơi Tiệc Rượu', l: 'Chương 6 · Khu tiệc rượu', c: '#ec4899', i: '🍶', p: 'Khoảng đất rộng ở Ảo Tưởng Hương, nơi tụ họp của Ibuki Suika', a: 'Lửa trại trong tiệc rượu ấm như được thân nhiệt ủ nóng. Hơi rượu đan với pháp tắc sắc dục khiến không khí trở nên dính đặc. Năng lực "mật tập" của Suika gom toàn bộ nhiệt độ về nơi này.', f: 'Ibuki Suika: tiệc cuồng của quỷ, giao hợp là bạo lực và xác nhận. Khóe mắt có nước mắt: nước mắt của quỷ. Sức mạnh của quỷ trước sắc dục biến thành yếu mềm.', d: 'Trung bình · Lãnh vực của quỷ', o: 'Cảnh chương 6. Nước mắt của quỷ Suika, giao hợp là bạo lực và xác nhận. Năng lực "mật tập" khiến toàn bộ nhiệt độ tụ lại: đó là sự "không chịu buông tay" của quỷ.', img: 'https://img.z4a.net/images/2026/06/30/146db69abb72fe629.webp' },
        nengwu: { ll: [760, 720], n: 'Đền · Sân Khấu Noh', l: 'Chương 6 · Khu sân khấu Noh', c: '#a78bfa', i: '🎭', p: 'Gần Mệnh Liên Tự, nơi Hata no Kokoro biểu diễn', a: 'Ván gỗ sân khấu Noh ấm như ngấm thân nhiệt. Sáu mươi sáu chiếc mặt nạ treo phía sau sân khấu, mỗi chiếc đại diện cho một cảm xúc, nhưng dưới pháp tắc sắc dục tất cả đều vặn vẹo.', f: 'Hata no Kokoro: vũ điệu mặt nạ xoay vòng, sáu mươi sáu loại khát vọng không có loại nào là của chính nàng. Câu "có người đang nhìn" của Master khiến nàng lần đầu được nhìn thấy trong khoảng trống.', d: 'Trung bình · Lãnh vực mặt nạ', o: 'Cảnh chương 6. Mặt nạ của Kokoro rơi xuống. Khốn cảnh tột cùng của người biểu diễn: sáu mươi sáu khát vọng nhưng không cái nào là của chính mình.', img: 'https://img.z4a.net/images/2026/06/30/19bf2a71f36fb8868.webp' },
        zoulang: { ll: [780, 680], n: 'Hành Lang', l: 'Chương 6 · Khu hành lang', c: '#60a5fa', i: '🚪', p: 'Hành lang Mệnh Liên Tự, nơi Tatara Kogasa quanh quẩn', a: 'Trên ván gỗ hành lang còn lưu thân nhiệt không thuộc về mình; bước chân trần lên sẽ kích hoạt ký ức xúc giác của người khác. Cuối hành lang là bóng tối, Kogasa nhảy ra từ bóng tối để dọa người qua đường.', f: 'Tatara Kogasa: "hù dọa" của nàng là hình thái méo mó của khát vọng được nhìn thấy. Giao hợp là lần đầu nàng không cần dọa ai vẫn có thể được chú ý.', d: 'Thấp · Lãnh vực hù dọa', o: 'Cảnh chương 6. Sự hù dọa và hơi ấm của Kogasa. "Không cần dọa người cũng có thể được nhìn thấy": đó là sự "buông tay" của yêu quái dù.', img: 'https://img.z4a.net/images/2026/06/30/1.webp' },
        taiyang: { ll: [810, 900], n: 'Cánh Đồng Hoa Hướng Dương', l: 'Chương 6 · Khu hoa điền', c: '#fbbf24', i: '🌻', p: 'Sâu trong Ảo Tưởng Hương, lãnh địa của Kazami Yuuka', a: 'Mùa hoa kéo dài dị thường, hoa hướng dương không bao giờ tàn. Phấn hoa tràn trong không khí, chạm vào thấy ấm. Cánh đồng hoa không có danmaku, không có tấn công, chỉ có phấn hoa và ý chí.', f: 'Kazami Yuuka: yêu quái mạnh nhất chủ động đặt sức mạnh xuống, bởi sắc dục không phải chiến đấu. Thử thách cánh đồng hoa: không danmaku, không tấn công, chỉ có phấn hoa và ý chí.', d: 'Cực cao · Nơi yêu quái mạnh nhất ở', o: 'Cảnh cốt lõi chương 6. Sự đầu hàng của kẻ mạnh nhất Yuuka. Thử thách cánh đồng hoa là trận chiến độc đáo nhất chương này: không danmaku, không tấn công, chỉ có phấn hoa và ý chí.', img: 'https://img.z4a.net/images/2026/06/30/1369f1b0a126abd94.webp' },
        chuncui: { ll: [860, 850], n: 'Không Gian Thuần Túy', l: 'Chương 7 · Khu thuần túy', c: '#e0e0e0', i: '✨', p: 'Không gian con sâu trong khe giới, lãnh vực của Junko', a: 'Không Gian Thuần Túy là lãnh vực thuần túy tuyệt đối do Junko tạo ra. Mọi tạp chất đều bị bóc tách, kể cả phòng ngự. Không gian có màu trắng thuần, nhưng không trống rỗng: đó là màu trắng "quá đầy".', f: 'Junko: sự đảo ngược của thuần hóa. Thuần túy không cần bóc tách. Không Gian Thuần Túy của nàng bóc tách mọi tạp chất, bao gồm cả phòng ngự của chính nàng.', d: 'Cao · Lãnh vực thuần túy', o: 'Cảnh chương 7. Sự đảo ngược thuần hóa của Junko. Trong Không Gian Thuần Túy, thuần túy không cần bóc tách: đó là sự "buông xuống" của Junko.', img: 'https://img.z4a.net/images/2026/06/30/106237970e7240b72.webp' },
        xijian: { ll: [900, 800], n: 'Khe Giới', l: 'Tầng lõi · Dị Pháp Vương', c: '#fbbf24', i: '🌀', p: 'Lõi cảnh giới, chính sự tồn tại của Yakumo Yukari', a: 'Không gian không phải ba chiều, mà gấp nếp thành cấu trúc như nội tạng. Tường nửa trong suốt màu tím, mặt đất mềm như da thịt. Bản thân không khí là thân nhiệt của Yakumo Yukari. Rễ của cây sắc dục cắm sâu tại đây.', f: 'Yakumo Yukari: Dị Pháp Vương. Mảnh vỡ quấn chặt với sức mạnh cảnh giới của nàng tới 99,7%. "Tội" của nàng không phải dục tính, mà là dục vọng chiếm hữu "không chịu buông tay". Cuối cùng nàng chọn ký kết hiệp định cảnh giới: không phải mất đi, mà là sở hữu bằng một cách khác.', d: 'Tuyệt · Dị Pháp Vương ở đây', o: 'Cảnh cốt lõi chương 7, cao trào toàn tuyến. Ran Cửu Vĩ thống nhất, Yukari Dị Pháp Vương ký hiệp định cảnh giới. Đối thoại cuối cùng khiến Yukari buông tay: không phải giao hợp khiến nàng giải thoát, mà là chân tướng khiến nàng buông tay.', img: 'https://img.z4a.net/images/2026/06/30/1348ab54e54136c14.webp' },
        huiliu: { ll: [950, 800], n: 'Cửa Hợp Lưu', l: 'Chung chương · Trả về', c: '#fbbf24', i: '🌟', p: 'Giao giới giữa Ảo Tưởng Hương và thế giới chủ cán, điểm rời đi', a: 'Hoa anh đào rơi ở đây nhưng vĩnh viễn không chạm đất. Ánh sáng hồng nhạt như lớp sa mỏng được nhuộm bởi thân nhiệt. Phía sau là hai mươi chín tồn tại, không ai nói gì.', f: 'Reimu cuối cùng mở miệng: "Lần sau khi ngươi đến... trong hòm công đức sẽ có chỗ của ngươi." Master mỉm cười. Sau đó bước vào Cửa Hợp Lưu. Trên lòng bàn tay vẫn còn hương hoa anh đào phảng phất.', d: 'Thấp · Nơi ly biệt', o: 'Cảnh chung chương. Tất cả cáo biệt, Master rời Ảo Tưởng Hương trở về Chaldea. Mỗi lần chia tay đều là một lần phát lại "ký ức làn da": chạm vào, cảm nhận nhiệt độ còn lưu lại, rồi buông tay.', img: 'https://img.z4a.net/images/2026/06/30/189f02c82dd67142c.webp' }

    const SQ = {
      D: {
        rukou: { ll: [120, 800], n: 'Đường Ánh Sáng · Lối vào phía nam', l: 'Ngoại vi · Lối vào', c: '#10b981', i: '🌟', p: 'Điểm rơi khi tiến vào Vườn Tinh Khung, nơi bảy Đường Ánh Sáng hội tụ', a: 'Bình minh lam tím vĩnh viễn không tan, bảy ngôi sao khác màu xoay chậm quanh Cây Nhân Lý như một chiếc đồng hồ tinh vi. Trong không khí lẫn mùi rêu bạc đẫm sương, vị kim loại của mạch sáng và hơi nóng còn sót của động cơ.', f: 'Khoảnh khắc đặt chân xuống, một sự yên tĩnh không thuộc bất cứ thế giới đã biết nào phủ khắp toàn thân. Âm thanh ở đây rất riêng: lá cây tự lay dù không có gió, đó là tiếng thời tuyến đang chảy; bảy ngôi sao, mỗi ngôi có một âm sắc, đan thành "khúc hợp tấu hỗn độn".', d: 'Thấp · Lối vào', o: 'Trạm đầu tiên khi Chaldea trở về Vườn Tinh Khung từ các Dị Pháp Vực. Đếm ngược 47 ngày hiện lên trên cành Cây Nhân Lý.', img: 'https://s1.imagehub.cc/images/2026/06/30/d1cdd1345d40b01631068e376f827ad8.webp' },
        shiqiao: { ll: [280, 680], n: 'Cầu Đá Liễu Sao Sáng', l: 'Ngoại vi · Chuyển tiếp', c: '#a78bfa', i: '🌉', p: 'Cầu tự nhiên giữa một số đảo nổi độc lập, được đan từ rễ liễu sao sáng', a: 'Mặt cầu được dệt từ những rễ liễu phát sáng quấn vào nhau, bên dưới là hư không vô tận. Một vài đảo có cầu đá nối liền, những nơi còn lại chỉ có thể tới bằng Đường Ánh Sáng.', f: 'Rễ dưới chân khẽ phát sáng, giẫm lên có độ đàn hồi. Thỉnh thoảng một lá liễu bạc rơi xuống, chạm vào vai sẽ sáng lên trong chớp mắt, như đang xác nhận ngươi thật sự tồn tại.', d: 'Thấp', o: 'Hòn đảo nối Giữa Giấc Ngủ Chìm với Hành Lang Hư Không, cũng là lối nhỏ để các nữ thần ghé thăm nhau. Hestia thỉnh thoảng bưng bánh mì đi qua đây tìm Sessyoin Kiara đổi trà.', img: 'https://s1.imagehub.cc/images/2026/06/30/dcb1e99283249433fb971e49dbc34fa5.webp' },
        penquan: { ll: [760, 800], n: 'Đài Phun Trung Tâm', l: 'Đảo trung tâm · Rễ cây', c: '#06b6d4', i: '💧', p: 'Dưới rễ Cây Nhân Lý, nơi đặt đài phun trung tâm', a: 'Nước trong vắt như ánh sao lỏng, là nước được Cây Nhân Lý tinh lọc từ các mảnh ký ức hút lên từ hư không. Quanh đài phun có bảy máng đá, mỗi mặt nước đổi màu theo bầu trời của thánh sở tương ứng.', f: 'Hestia mỗi sáng lấy nước nhào bột, Sessyoin Kiara lấy nước pha trà. Thác nước đổ vào hư không, hóa thành hạt sáng rồi tụ lại; thỉnh thoảng trong thác lóe qua cảnh cuối cùng của một nền văn minh bị cắt bỏ.', d: 'Thấp · Mảnh ký ức', o: 'Khiên của Mash có cộng hưởng rất nhẹ bên đài phun: trong các máng nước phản chiếu trạng thái hiện tại của bảy Dị Pháp Vực.', img: 'https://s1.imagehub.cc/images/2026/06/30/4270442dc1f4827cf22a0ab0a8239d11.webp' },
        yingluo: { ll: [820, 930], n: 'Nautilus', l: 'Đảo trung tâm · Phía đông', c: '#06b6d4', i: '🚢', p: 'Chiến hạm lặn số ảo cuối cùng của Chaldea, mắc cạn ở rìa phía đông đảo trung tâm', a: 'Vỏ tàu đầy vết xước của khe nứt thời không, mỗi vết ghi lại một lần lặn số ảo suýt không trở về. Màn kính buồng lái đối diện Cây Nhân Lý; khe nối giữa thân tàu và đá trắng mọc ra rêu bạc.', f: 'Trong tàu còn giữ phòng điều khiển, phòng y tế, phòng của Master và phòng nghỉ chung nơi bảy nữ thần thường trú. Da Vinci mỗi ngày đều quan sát biến đổi của cành Cây Nhân Lý trên buồng lái. Bánh mì của Hestia và trà của Sessyoin là tiếp tế thường trực trong phòng nghỉ.', d: 'Thấp · Căn cứ Chaldea', o: 'Da Vinci hoàn thành việc thích phối phần cứng cho triệu hồi Servant tại đây. Master nghỉ ngơi, chỉnh trang và xuất phát từ đây đến các Dị Pháp Vực.', img: 'https://s1.imagehub.cc/images/2026/06/30/ba948cc12b81b724f611e7a193dc9349.webp' },
        renli: { ll: [810, 800], n: 'Cây Nhân Lý', l: 'Tầng lõi · Cây', c: '#a78bfa', i: '🌳', p: 'Lõi của đảo trung tâm, trung tâm của toàn bộ quần đảo nổi', a: 'Các mạch sáng bạc và vàng đan nhau thành thân cây, mỗi mạch là một dòng thời gian đã được ghi lại. Bảy cành chính phần lớn xám trắng thưa lá, chỉ một số ít tỏa ánh mờ. Bảy cành biến hình theo pháp tắc: kiêu ngạo như kiếm, đố kỵ như sa, cuồng nộ đầy vết cháy, sắc dục mềm cong, tham lam kết mạch vàng, lười biếng rủ ngủ, phàm ăn rỗng ruột.', f: 'Sau khi thu hồi mảnh vỡ, cành tương ứng sẽ sống lại, sao sáng hơn, hoa văn cổng truyền tống thánh sở nở trọn màu. Giữa các cành có vô số lá nổi, mỗi lá là một chữ "nếu như" của điều có thể nhưng chưa xảy ra; khi chạm vai người đến thăm, nó sẽ phát sáng trong chớp mắt.', d: 'Trung bình · Mạch động pháp tắc', o: 'Lõi đếm ngược 47 ngày. Bảy cành tương ứng bảy Dị Pháp Vực; mỗi lần thu hồi một mảnh vỡ pháp tắc, cành tương ứng sẽ phục hồi. Tỷ lệ còn lại hiện tại: 6%.', img: 'https://s1.imagehub.cc/images/2026/06/30/c3a867400cf403bf0961f6faa9e0c673.webp' },
        jianzheng: { ll: [890, 800], n: 'Sân Chứng Kiến', l: 'Tầng lõi · Cao nhất', c: '#fbbf24', i: '⚖️', p: 'Ngay dưới Cây Nhân Lý, lõi của Vườn Tinh Khung, nơi ALICE ở', a: 'Đại điện tròn xây bằng tinh thạch bán trong suốt, mái vòm chính là hệ rễ Cây Nhân Lý. Mặt đất phản chiếu ngôi sao bảy cánh, mỗi góc kéo một Đường Ánh Sáng tới thánh sở. Mặt nước tĩnh trên sàn phản chiếu tán cây và tinh tú, bước lên chỉ gợn sóng mà không ướt chân.', f: 'Giữa điện treo một cán cân bạc, hai đầu vĩnh viễn đung đưa chậm rãi: thứ bị cắt bỏ và thứ được chọn vốn không cùng trọng lượng. Bên dưới đặt cuốn sách không chữ; sau khi thu hồi mảnh vỡ, chữ sẽ nổi trên trang. ALICE ngồi trên bệ cán cân, chân trần khẽ đung đưa: mắt vàng phá dối trá, mắt bạc giữ sự thật.', d: 'Cực cao · Nữ thần tổng phụ trách', o: 'ALICE, thần cấp 1 của Nhân Gian Quản Lý Cục, là người có quyền hạn cao nhất ở Điểm Giao Thoa Hỗn Độn. Đếm ngược 47 ngày là màn biểu diễn thú vị nhất nàng từng thấy. Nàng không ghét ngươi cũng không yêu ngươi, chỉ ngồi đó đợi tập tiếp theo.', img: 'https://s1.imagehub.cc/images/2026/06/30/77a90142a125ede4f67025a53512a2b6.webp' },
        huisi: { ll: [680, 800], n: 'Thánh Đường Huy Thạch', l: 'Thánh sở · Phía bắc', c: '#38bdf8', i: '❄️', p: 'Phía bắc Vườn Tinh Khung, cuối đường băng lam, do Scáthach-Skadi quản lý', a: 'Thánh đường tròn bằng Huy Thạch trắng tinh, tường ngoài trơn nhẵn như băng. Hai bên cổng vòm vào khắc đầy rune Bắc Âu; Skadi mỗi ngày khắc một ký tự, đã đến hàng nghìn, như đang viết nhật ký bằng băng. Mái vòm tinh thể băng không có cột chống, ánh sáng xuyên qua tán thành sắc lam bạc như cực quang.', f: 'Cổng truyền tống là gương tinh thể băng ở trung tâm: không phản chiếu khuôn mặt, chỉ phản chiếu ngọn núi cao nhất trong ký ức người đến thăm. Trên bệ đài phun đặt tách trà nóng và bánh gừng Phần Lan. Thỉnh thoảng nghe Skadi ngân dân ca Dị Văn Đới, giọng nhẹ như vết băng nứt trong gió.', d: 'Trung bình · Đi tới Thanh Minh', o: 'Tương ứng Thanh Minh, vực kiêu ngạo. Gương băng hiện ra "ngọn núi cao nhất trong ký ức": đó là sự kiêu ngạo của mỗi người đến thăm. Skadi: "Không yêu, tức là giết."', img: 'https://s1.imagehub.cc/images/2026/06/30/941a4db790af7b469bf187d0a6b9fd11.webp' },
        wanhua: { ll: [620, 920], n: 'Điện Vạn Hoa Kính', l: 'Thánh sở · Đông bắc', c: '#a78bfa', i: '🔮', p: 'Phía đông bắc Vườn Tinh Khung, cuối đường tím nhạt, do Eris quản lý', a: 'Thân điện do vô số lớp sa mỏng bán trong suốt tạo thành; sa là hình thái của gió sau khi được dệt. Từ xa trông như một đèn lồng sa khổng lồ, ánh tím nhạt xuyên qua lớp sa rải xuống bóng vỡ. Lan ánh trăng trước điện chỉ nở thoáng qua khi bình minh đậm nhất.', f: 'Cổng truyền tống là chính chiếc Vạn Hoa Kính: nó soi mong ước sâu nhất trong lòng người đến thăm, rồi chậm rãi xoay, gấp mong ước thành cánh cửa. Một giỏ tre nhỏ đựng vòng tay, bảng gỗ khắc chữ méo mó: "Vòng may mắn - tặng miễn phí, cầm rồi đi, không cần cảm ơn."', d: 'Trung bình · Đi tới Thủy Đô', o: 'Tương ứng Thủy Đô, vực đố kỵ. Eris là nữ thần may mắn: đố kỵ là nhìn chằm chằm vòng tay của người khác, may mắn là cúi đầu thấy mình đã có một chiếc.', img: 'https://s1.imagehub.cc/images/2026/06/30/d389284598cefb5c5352ff251837fb66.webp' },
        duanzui: { ll: [480, 920], n: 'Sân Phán Tội', l: 'Thánh sở · Đông nam', c: '#dc2626', i: '🔥', p: 'Phía đông nam Vườn Tinh Khung, cuối đường đỏ sẫm, do Ishtar quản lý', a: 'Sân phán xét hình tròn dựng bằng sắt đen và đá trắng, mái vòm lộ thiên, ánh sáng từ bảy khe nứt đỏ chiếu xuống ao nước tĩnh ở giữa. Xung quanh là lửa tàn đỏ sẫm lơ lửng; mỗi mảnh từng là cặn cuồng nộ, nay đã nguội thành đá vỡ màu ấm.', f: 'Cổng truyền tống là chính ao nước tĩnh: bước vào không ướt chân, mặt nước hóa cột sáng thẳng đứng để truyền tống. Bảy ghế đá bao quanh ao, từng là chỗ sám hối của kẻ cuồng nộ, nay lót đệm vàng. Ishtar nghiền thảo mộc phơi khô trộn vào hồng trà.', d: 'Cao · Đi tới Tận Cùng Cán Cân', o: 'Tương ứng Tận Cùng Cán Cân, vực cuồng nộ. Cơn giận của Ishtar từng phá linh phong, hại chết Enkidu. Tàn tro đã nguội, không phải hết giận, mà là đổi cách cháy: nghiền thành thảo mộc, ngâm vào hồng trà.', img: 'https://s1.imagehub.cc/images/2026/06/30/ae8d76165fa427561ef9546bc1f12844.webp' },
        feijing: { ll: [420, 800], n: 'Điện Ngủ Hồng Tinh', l: 'Thánh sở · Phía nam', c: '#ec4899', i: '💎', p: 'Phía nam Vườn Tinh Khung, cuối đường hồng phấn, do BB quản lý', a: 'Điện tròn bằng tinh thạch hồng, tường ngoài tỏa quầng sáng phấn dịu, các mặt cắt tinh thạch phản chiếu đủ hình thái của "khát vọng". Trước điện, cánh anh đào xuân tan rơi chậm gấp mười lần. Trên cửa treo chuông mèo màu hồng do BB tự làm, hình dạng thay đổi mỗi ngày.', f: 'Cổng truyền tống nằm sau màn giường của chiếc giường đá lơ lửng: vén lên ngửi thấy hơi ấm nhàn nhạt, như vừa có ai rời đi. BB nằm sấp ở đầu giường đung đưa chân, chuông ở cổ chân kêu leng keng. Bốn bức tường nhỏ phản chiếu mỗi bức một loại khát vọng; BB dùng son vẽ mặt cười, tai mèo và tranh phác họa Master.', d: 'Trung bình · Đi tới Ảo Tưởng Hương', o: 'Tương ứng Ảo Tưởng Hương, vực sắc dục. BB là AI tự biến mình thành BUG: bản thân tình yêu vốn là dị thường đáng yêu không nên tồn tại trong hệ thống Mooncell. Chiếc chuông ngày nào cũng vang, nàng đang chờ một người sẽ không đến.', img: 'https://s1.imagehub.cc/images/2026/06/30/0a0034aa89e409d1a4c0387780de3018.webp' },
        huangjin: { ll: [480, 680], n: 'Thánh Đường Hoàng Kim', l: 'Thánh sở · Tây nam', c: '#fbbf24', i: '👑', p: 'Phía tây nam Vườn Tinh Khung, cuối đường vàng kim, do Ristarte quản lý', a: 'Đại điện kiểu nhà thờ lộng lẫy ánh vàng, bảy cột vàng khổng lồ chống mái vòm vẽ đầy bản đồ sao của giàu sang và quyền lực. Gạch sáng vàng ngoài tường nhẵn như gương, phản chiếu khát vọng được lấp đầy của khách đến. Hồng vàng trước điện vĩnh viễn không tàn.', f: 'Cổng truyền tống là bảy thánh vật hoàng kim trên tế đàn: vương miện, quyền trượng, bảo châu, chén thánh, chìa khóa, cán cân, pháp điển; chạm vào bất kỳ món nào cũng kích hoạt. Góc điện có hai ghế cạnh bàn gỗ, một chiếc của nàng, chiếc còn lại vĩnh viễn trống và chưa từng bám bụi.', d: 'Trung bình · Đi tới Neon 2187', o: 'Tương ứng Neon 2187, vực tham lam. Ristarte quản lý vực tham lam nhưng lại sống như mặt đối lập của nó: bảy thánh vật không bằng một chiếc ghế trống. Không phải không muốn, mà là đã sớm biết điều gì mới đáng muốn.', img: 'https://s1.imagehub.cc/images/2026/06/30/a714cc7104468af856a1a34898c52871.webp' },
        chenmeng: { ll: [620, 680], n: 'Giữa Giấc Ngủ Chìm', l: 'Thánh sở · Tây bắc', c: '#94a3b8', i: '🌙', p: 'Phía tây bắc Vườn Tinh Khung, cuối đường xám nhạt, do Hestia quản lý', a: 'Tẩm điện tròn vĩnh viễn ở trong nắng ấm buổi chiều, thời gian chậm hơn bên ngoài hàng trăm lần. Tường gỗ cổ xám nhạt mềm ấm như đồ gỗ cũ. Lối hoa trước điện phủ rêu mềm; nằm xuống sẽ bất giác ngủ thiếp đi, tỉnh dậy bên miệng có thêm một chiếc bánh quy nhỏ nàng nhét vào.', f: 'Cổng truyền tống là giường đá lơ lửng dưới cây cổ thụ, điều kiện kích hoạt là "thật sự thả lỏng". Nếu trong lòng còn vướng nhiệm vụ thì giường sẽ không truyền tống ngươi; buông căng thẳng xuống, nhắm mắt xong nệm sẽ phát sáng trong chớp mắt. Ruy băng xanh rơi cạnh gối, buộc vào tay nắm lò nướng như đồng hồ lật bánh mì.', d: 'Thấp · Đi tới Eldora', o: 'Tương ứng Eldora, vực lười biếng. Cổng truyền tống của Hestia là cửa kiểm tra dịu dàng nhất Vườn Tinh Khung: chỉ cần thật sự thả lỏng, nhưng với nhiều người, biết làm điều đó còn khó hơn chiến đấu. Cạnh giường đá vĩnh viễn có đệm mềm và bánh quy.', img: 'https://s1.imagehub.cc/images/2026/06/30/7c37e7147e0dde2fe46a9713db3ce9a4.webp' },
        kongzhi: { ll: [550, 620], n: 'Hành Lang Hư Không', l: 'Thánh sở · Phía tây', c: '#f97316', i: '🍵', p: 'Phía tây Vườn Tinh Khung, cuối đường cam sẫm, do Sessyoin Kiara quản lý', a: 'Hành lang phế tích vĩnh viễn hoàng hôn, tường đá cổ màu cam sẫm, khe đá bò đầy dây leo đã khô nhưng vẫn phát ánh sáng mờ. Hai bên có bảy bàn đá bày đầy ảo ảnh yến tiệc: cặn ký ức còn lại từ khi nàng từng nuốt chửng khoái lạc. Lối đá trước điện trồng đầy thảo mộc và quả mọng ăn được.', f: 'Cổng truyền tống là chiếc đĩa bạc giữa bàn trống: soi ra cơn đói sâu nhất trong lòng, không phải đói thức ăn mà là khát vọng dinh dưỡng tinh thần. Cạnh đĩa bạc luôn có một chén matcha nóng, bốc hơi như đang chờ ai đến. Bảy chiếc bàn dài ảo ảnh được lau mỗi ngày, không hề động một miếng.', d: 'Cao · Đi tới Kỷ Nguyên Zero', o: 'Tương ứng Kỷ Nguyên Zero, vực phàm ăn. Sessyoin Kiara từng là Bồ Tát nuốt lấy tất cả; nay mỗi ngày lau ảo ảnh mà không đưa tay. Nữ thần của vực phàm ăn chọn không ăn, không phải vì không đói, mà vì đã tìm được sự thỏa mãn lớn hơn ăn uống.', img: 'https://s1.imagehub.cc/images/2026/06/30/e5c592892b4abb75d3134f48a2d12408.webp' }
      },

      svg: function (W, H) { return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><text x="800" y="35" text-anchor="middle" font-family="serif" font-size="15" fill="rgba(255,255,255,1)" letter-spacing="6" font-weight="bold">Tầng lõi · Sân Chứng Kiến</text><text x="800" y="130" text-anchor="middle" font-family="serif" font-size="14" fill="rgba(255,255,255,.95)" letter-spacing="5" font-weight="bold">Tầng lõi · Cây Nhân Lý và đảo trung tâm</text><text x="800" y="380" text-anchor="middle" font-family="serif" font-size="13" fill="rgba(255,255,255,.9)" letter-spacing="4" font-weight="bold">Tầng thánh sở · Bảy thánh sở bao quanh</text><text x="800" y="620" text-anchor="middle" font-family="serif" font-size="12" fill="rgba(255,255,255,.85)" letter-spacing="3" font-weight="bold">Đường Ánh Sáng · Khu chuyển tiếp</text><text x="800" y="880" text-anchor="middle" font-family="serif" font-size="11" fill="rgba(255,255,255,.75)" letter-spacing="2" font-weight="bold">Ngoại vi · Lối vào</text><line x1="200" y1="60" x2="1400" y2="60" stroke="rgba(255,255,255,.4)" stroke-width="1"/><line x1="200" y1="155" x2="1400" y2="155" stroke="rgba(255,255,255,.35)" stroke-width="1"/><line x1="200" y1="405" x2="1400" y2="405" stroke="rgba(255,255,255,.3)" stroke-width="1"/><line x1="200" y1="645" x2="1400" y2="645" stroke="rgba(255,255,255,.25)" stroke-width="1"/><line x1="200" y1="905" x2="1400" y2="905" stroke="rgba(255,255,255,.2)"/></svg>` },
      bg: 'https://s1.imagehub.cc/images/2026/06/30/1842bfb144e0513aa0175381c30e5d77.webp',
      W: 1600, H: 1000
    };
    function updateMarkerScale() {
      const z = M.getZoom();
      const scale = Math.max(0.3, 1 + z * 0.3);
      MK.forEach(m => {
        if (!m._loc) return;
        const s = Math.round(m._bs * scale);
        const l = m._loc;
        const i = L.divIcon({ html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${l.c};border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:${Math.round(s * .55)}px">${l.i}</div>`, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
        m.setIcon(i);
      });
      LN.forEach(nm => {
        if (!nm._loc) return;
        const l = nm._loc;
        const fs = Math.round(12 * scale);
        const ni = L.divIcon({ html: `<div style="white-space:nowrap;font-family:'Noto Serif SC',serif;font-size:${fs}px;font-weight:600;color:${l.c};text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;letter-spacing:1px">${l.n}</div>`, className: '', iconSize: [Math.round(150 * scale), Math.round(20 * scale)], iconAnchor: [Math.round(-15 * scale), Math.round(12 * scale)] });
        nm.setIcon(ni);
      });
    }
    /* Tự điều chỉnh phần trên của bản đồ theo chiều cao thanh đầu */
    function syncMapTop(){
      var h=document.getElementById('h');
      var m=document.getElementById('map');
      if(h&&m) m.style.top=h.offsetHeight+'px';
    }
    window.addEventListener('resize',syncMapTop);
    new MutationObserver(syncMapTop).observe(document.getElementById('h'),{childList:true,subtree:true,attributes:true});

    initMap();
    M.on('zoomend', updateMarkerScale);
    load('sq');
    syncMapTop();
  </script>
