<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Nguyên Toái Giới · Bản đồ Dị Pháp Vực</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0a0a12;
      --card: rgba(15, 12, 25, .92);
      --gold: #d4a853;
      --gl: #f0d078;
      --pur: #8b5cf6;
      --pd: #4c1d95;
      --red: #dc2626;
      --cyan: #06b6d4;
      --blue: #3b82f6;
      --green: #10b981;
      --bdr: rgba(212, 168, 83, .4);
      --txt: #e8e0d0;
      --txm: rgba(232, 224, 208, .6)
    }

    body {
      background: var(--bg);
      font-family: 'Noto Serif SC', serif;
      overflow: hidden;
      height: 100vh
    }

    #h {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      min-height: 52px;
      height: auto;
      background: rgba(10, 8, 20, .98);
      border-bottom: 1px solid var(--bdr);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 6px 16px;
      gap: 6px
    }

    #h .logo {
      display: flex;
      align-items: center;
      gap: 10px
    }

    #h .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px
    }

    #h .title-text {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 20px;
      font-weight: 900;
      color: var(--gl);
      letter-spacing: 3px
    }

    #h .subtitle {
      font-size: 9px;
      color: var(--txm);
      letter-spacing: 4px;
      margin-top: 2px
    }

    #h .stats {
      display: flex;
      gap: 16px
    }

    .stat {
      text-align: center;
      padding: 0 8px
    }

    .stat-v {
      font-size: 16px;
      font-weight: 700;
      color: var(--gl)
    }

    .stat-l {
      font-size: 8px;
      color: var(--txm);
      letter-spacing: 1px
    }

    #h .tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      flex: 1 1 auto;
      min-width: 0
    }
    #h .tabs::-webkit-scrollbar { display: none }

    .tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--bdr);
      background: var(--card);
      color: var(--txm);
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Noto Serif SC', serif;
      white-space: nowrap;
      flex-shrink: 0
    }

    .tab:hover {
      border-color: var(--gold);
      color: var(--gl)
    }

    .tab.on {
      background: var(--gold);
      color: #1a1a2e;
      border-color: var(--gold);
      font-weight: 700
    }

    #map {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      transition: top .15s
    }

    .leaflet-container {
      background: var(--bg) !important
    }

    .leaflet-control-zoom a {
      background: var(--card) !important;
      border: 1px solid var(--bdr) !important;
      color: var(--gold) !important;
      font-family: 'Noto Serif SC', serif
    }

    .leaflet-popup-content-wrapper {
      background: var(--card) !important;
      border-radius: 8px !important;
      border: 1px solid var(--bdr) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .8) !important;
      padding: 0 !important;
      overflow: hidden;
      min-width: 280px
    }

    .leaflet-popup-content {
      margin: 0 !important;
      color: var(--txt);
      font-family: 'Noto Serif SC', serif
    }

    .leaflet-popup-tip-container {
      display: none
    }

    .leaflet-popup-close-button {
      color: var(--gold) !important;
      font-size: 20px !important;
      top: 12px !important;
      right: 14px !important
    }

    .leaflet-popup-pane {
      z-index: 2000 !important
    }

    .p-h {
      padding: 18px 22px 14px;
      border-bottom: 1px solid rgba(212, 168, 83, .2);
      background: rgba(139, 92, 246, .08)
    }

    .p-b {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      font-weight: 600;
      border: 1px solid
    }

    .p-n {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 2px
    }

    .p-bd {
      padding: 16px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .p-r {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 16px;
      line-height: 1.7
    }

    .p-i {
      width: 24px;
      flex-shrink: 0;
      text-align: center;
      margin-top: 2px;
      font-size: 18px
    }

    .p-rl {
      color: var(--gold);
      min-width: 64px;
      flex-shrink: 0;
      font-weight: 600;
      font-size: 15px
    }

    .p-rv {
      color: var(--txt);
      flex: 1;
      font-size: 15px
    }

    .p-d {
      margin-top: 6px;
      padding: 12px 16px;
      background: rgba(139, 92, 246, .08);
      border-left: 3px solid var(--pur);
      border-radius: 0 6px 6px 0;
      font-size: 14px;
      color: var(--txm);
      line-height: 1.7
    }

    .p-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      background: var(--pd);
      border: 1px solid var(--bdr);
      border-radius: 6px;
      color: var(--gl);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      letter-spacing: 2px
    }

    /* Hộp thoại nổi ở giữa màn hình */
    #locModal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center
    }
    #locModal.show {
      display: flex;
      animation: lmFade .25s ease
    }
    @keyframes lmFade { from { opacity: 0 } to { opacity: 1 } }
    #locModal .lm-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer
    }
    #locModal .lm-box {
      position: relative;
      width: 90%;
      max-width: 440px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--bdr);
      border-radius: 10px;
      box-shadow: 0 16px 56px rgba(0,0,0,.9), 0 0 0 1px rgba(212,168,83,.1);
      animation: lmUp .32s cubic-bezier(.4,0,.2,1)
    }
    @keyframes lmUp { from { transform: translateY(34px) scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
    #locModal .lm-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--bdr);
      color: var(--gold);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all .2s;
      font-family: serif
    }
    #locModal .lm-close:hover {
      background: var(--gold);
      color: #1a1a2e;
      transform: rotate(90deg)
    }
    #locModal .lm-box::-webkit-scrollbar { width: 4px }
    #locModal .lm-box::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px }

    /* Khu hiển thị ảnh trong hộp thoại */
    .p-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      cursor: zoom-in;
      background: #1a1a25
    }
    .p-img-wrap::after {
      content: '🔍 Bấm để phóng to';
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 4px 10px;
      background: rgba(0,0,0,.7);
      border: 1px solid var(--bdr);
      border-radius: 4px;
      color: var(--gl);
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s
    }
    .p-img-wrap:hover::after { opacity: 1 }
    .p-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .4s ease
    }
    .p-img-wrap:hover .p-img { transform: scale(1.05) }

    /* Trình xem ảnh toàn màn hình */
    #imgViewer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }
    #imgViewer.show { display: flex; animation: ivFade .3s ease }
    @keyframes ivFade { from { opacity: 0 } to { opacity: 1 } }
    #imgViewer img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border: 1px solid var(--bdr);
      box-shadow: 0 0 80px rgba(212,168,83,.15);
      animation: ivZoom .35s cubic-bezier(.4,0,.2,1)
    }
    @keyframes ivZoom { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    #imgViewer .iv-close {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 1px solid var(--bdr);
      color: var(--gl);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      font-family: serif
    }
    #imgViewer .iv-close:hover {
      background: var(--gold);
      color: #1a1a2e;
      transform: rotate(90deg)
    }
    #imgViewer .iv-overlay {
      position: absolute;
      inset: 0;
      cursor: zoom-out
    }

    #lg {
      position: fixed;
      bottom: 10px;
      left: 6px;
      z-index: 900;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--bdr);
      padding: 8px 10px;
      max-height: 50vh;
      overflow-y: auto
    }

    .lg-t {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 6px;
      font-weight: 600
    }

    .lg-i {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 8px;
      color: var(--txm);
      margin-bottom: 3px
    }

    .lg-d {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    /* Màn hình vừa: giảm khoảng đệm và cỡ chữ của nhãn */
    @media screen and (max-width:768px) {
      .tab { padding: 4px 10px; font-size: 11px }
      #h .logo-icon { width: 24px; height: 24px; font-size: 14px }
      #h .title-text { font-size: 16px; letter-spacing: 2px }
      #h .subtitle { display: none }
      #h .stats { gap: 10px }
      .stat-v { font-size: 14px }
      .stat-l { font-size: 7px }
    }

    /* Màn hình hẹp: thu nhỏ logo hơn, cho nhãn cuộn ngang, ẩn thanh thống kê */
    @media screen and (max-width:480px) {
      .leaflet-popup-content-wrapper {
        min-width: 200px !important;
        max-width: 240px !important
      }

      #lg {
        display: none !important
      }

      #h { padding: 0 8px }
      #h .logo-icon { width: 22px; height: 22px; font-size: 12px }
      #h .title-text { font-size: 14px; letter-spacing: 1px }
      #h .stats { display: none }
      .tab { padding: 3px 8px; font-size: 10px; border-radius: 14px }
    }
  </style>
</head>

<body>
  <div id="h">
    <div class="logo">
      <div class="logo-icon" id="logo-icon">☯</div>
      <div>
        <div class="title-text" id="title-text">Tiên Kiếp Kỷ Thanh Minh</div>
        <div class="subtitle" id="subtitle">Dị Pháp Vực · LOSTBELT</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" data-w="sq" onclick="sw('sq')">Vườn Tinh Khung</div>
      <div class="tab" data-w="qm" onclick="sw('qm')">Thanh Minh</div>
      <div class="tab" data-w="ad" onclick="sw('ad')">Eldora</div>
      <div class="tab" data-w="nh" onclick="sw('nh')">Neon 2187</div>
      <div class="tab" data-w="sd" onclick="sw('sd')">Thủy Đô</div>
      <div class="tab" data-w="jy" onclick="sw('jy')">Kỷ Nguyên Zero</div>
      <div class="tab" data-w="xx" onclick="sw('xx')">Ảo Tưởng Hương</div>
    </div>
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-v" id="stat1">6</div>
        <div class="stat-l" id="stat1l">Tầng</div>
      </div>
      <div class="stat">
        <div class="stat-v" id="stat2">24</div>
        <div class="stat-l" id="stat2l">Địa điểm</div>
      </div>
      <div class="stat">
        <div class="stat-v" id="stat3">∞</div>
        <div class="stat-l" id="stat3l">Cơ duyên</div>
      </div>
    </div>
  </div>
  <div id="map"></div>
  <div id="lg"></div>

  <!-- Hộp thoại nổi ở giữa màn hình -->
  <div id="locModal">
    <div class="lm-overlay" onclick="closeLocModal()"></div>
    <div class="lm-box">
      <div class="lm-close" onclick="closeLocModal()">×</div>
      <div id="locModalContent"></div>
    </div>
  </div>

  <!-- Trình xem ảnh toàn màn hình -->
  <div id="imgViewer">
    <div class="iv-overlay" onclick="closeImgViewer()"></div>
    <div class="iv-close" onclick="closeImgViewer()">×</div>
    <img id="imgViewerImg" src="" alt="">
  </div>
  <script>
    function g(l) { const m = `Đi tới ${l}`; try { const t = document.querySelector('#send_textarea'); if (t) { t.value = m; const s = document.querySelector('#send_but'); if (s) s.click() } } catch (e) { console.log(m) } }
    function showLocModal(l) {
      const imgHtml = l.img ? `<div class="p-img-wrap" onclick="openImgViewer('${l.img}')"><img class="p-img" src="${l.img}" alt="${l.n}" onerror="this.parentNode.style.display='none'"></div>` : '';
      const html = `${imgHtml}<div class="p-h"><div class="p-b" style="background:${l.c}22;color:${l.c};border-color:${l.c}">${l.l}</div><div class="p-n" style="color:${l.c}">${l.n}</div></div><div class="p-bd"><div class="p-r"><div class="p-i">📍</div><div><span class="p-rl">Vị trí</span><span class="p-rv">${l.p}</span></div></div><div class="p-r"><div class="p-i">👁️</div><div><span class="p-rl">Ngoại quan</span><span class="p-rv" style="color:var(--txm)">${l.a}</span></div></div><div class="p-r"><div class="p-i">✨</div><div><span class="p-rl">Đặc trưng</span><span class="p-rv" style="color:${l.c}">${l.f}</span></div></div><div class="p-r"><div class="p-i">⚠️</div><div><span class="p-rl">Nguy hiểm</span><span class="p-rv" style="color:#f87171">${l.d}</span></div></div><div class="p-d">📌 ${l.o}</div><button onclick="g('${l.n}')" class="p-btn">⚔️ Đi tới ${l.n}</button></div>`;
      document.getElementById('locModalContent').innerHTML = html;
      document.getElementById('locModal').classList.add('show');
    }
    function closeLocModal() {
      document.getElementById('locModal').classList.remove('show');
    }
    function openImgViewer(src) {
      document.getElementById('imgViewerImg').src = src;
      document.getElementById('imgViewer').classList.add('show');
    }
    function closeImgViewer() {
      document.getElementById('imgViewer').classList.remove('show');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeImgViewer(); closeLocModal(); }
    });
    let M, LY = [], MK = [], LN = [], PP = [], CC = [];
    function initMap() { M = L.map('map', { crs: L.CRS.Simple, minZoom: -1.5, maxZoom: 3, zoomControl: true, attributionControl: false, center: [500, 800], zoom: 0, maxBoundsViscosity: 1 }) }
    function clearMap() { LY.forEach(l => M.removeLayer(l)); MK.forEach(m => M.removeLayer(m)); LN.forEach(n => M.removeLayer(n)); PP.forEach(p => M.removeLayer(p)); CC.forEach(c => M.removeLayer(c)); LY = []; MK = []; LN = []; PP = []; CC = [] }
    function addBg(u, W, H) { const B = [[0, 0], [H, W]]; M.setMaxBounds(B); const bg = L.imageOverlay(u, B, { opacity: 1, zIndex: 1, interactive: false }).addTo(M); LY.push(bg); M.fitBounds(B); return B }
    function addSvg(s, W, H, B) { const u = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); const l = L.imageOverlay(u, B, { opacity: 1, zIndex: 2, interactive: false }).addTo(M); LY.push(l) }
    function renderL(D, C, lg, ti, st) { document.getElementById('title-text').textContent = ti.t; document.getElementById('subtitle').textContent = ti.s; document.getElementById('logo-icon').textContent = ti.i; document.getElementById('stat1').textContent = st[0]; document.getElementById('stat2').textContent = st[1]; document.getElementById('stat3').textContent = st[2]; document.getElementById('stat1l').textContent = st[3]; document.getElementById('stat2l').textContent = st[4]; document.getElementById('stat3l').textContent = st[5]; document.getElementById('lg').innerHTML = lg; const X = {}; Object.entries(D).forEach(([k, l]) => { const layer = String(l.l || '').toLowerCase(); const s = layer.includes('lõi') || layer.includes('đỉnh') || layer.includes('thần điện') || layer.includes('thánh đường') || layer.includes('vực chủ') ? 36 : 28; const i = L.divIcon({ html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${l.c};border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:${s * .55}px">${l.i}</div>`, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] }); const m = L.marker(l.ll, { icon: i, interactive: true }).addTo(M); MK.push(m); m._loc = l; m._bs = s; const ni = L.divIcon({ html: `<div style="white-space:nowrap;font-family:'Noto Serif SC',serif;font-size:12px;font-weight:600;color:${l.c};text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;letter-spacing:1px">${l.n}</div>`, className: '', iconSize: [150, 20], iconAnchor: [-15, 12] }); const nm = L.marker(l.ll, { icon: ni, interactive: false }).addTo(M); LN.push(nm); nm._loc = l; m.on('click', () => showLocModal(l)); X[k] = m }); C.forEach(c => { const f = D[c.f], t = D[c.t]; if (!f || !t) return; const p = L.polyline([f.ll, t.ll], { color: c.c, weight: 3, opacity: .6, dashArray: c.s === 'd' ? '8,10' : null }).addTo(M); PP.push(p) }); return X }

    const QM = {
      D: {
        rukou: { ll: [50, 800], n: 'Điểm Giao Thoa Hỗn Độn · Lối vào Thanh Minh', l: 'Tầng ngoài · Cửa vào', c: '#fbbf24', i: '🌀', p: 'Điểm rơi nơi Chaldea nhảy từ Điểm Giao Thoa Hỗn Độn vào cõi Thanh Minh.', a: 'Bầu trời vàng kim vĩnh hằng, không có ngày đêm luân phiên; linh khí tinh thuần nhưng đứng yên, như bị nhốt trong chai.', f: 'Da Vinci cảm nhận: "Linh khí ở đây rất tinh thuần, nhưng đứng yên, như bị nhốt trong chai."', d: 'Thấp · Cửa vào', o: 'Trạm đầu tiên khi Chaldea vào cõi Thanh Minh; dưới bầu trời vàng kim vĩnh hằng, không khí yên lặng đến bất thường.', img: 'https://img.z4a.net/images/2026/06/30/17ab50d355d44350a.webp' },
        jinghu: { ll: [80, 700], n: 'Hồ Gương', l: 'Tầng ngoài · Mặt ngầm', c: '#06b6d4', i: '💧', p: 'Hồ ngầm dưới khu tụ lạc bỏ hoang, không nằm trong bất kỳ bản ghi pháp tắc nào.', a: 'Mặt nước phẳng lặng đến cực độ; thứ phản chiếu không phải bầu trời tím đen hiện tại mà là nền trời xanh ba nghìn năm trước, trước khi pháp tắc thanh tẩy vận hành.', f: 'Chạm vào mặt nước sẽ thoáng thấy hình ảnh liên quan đến nơi sâu nhất trong cảm xúc của chính mình, kéo dài khoảng ba giây.', d: 'Không rõ · Khu ẩn', o: 'Bùi Thanh Ca biết nơi này. Suốt ba nghìn năm, cách một thời gian hắn lại một mình đến đây, cúi người nhìn mảng trời xanh trong mặt nước.', img: 'https://img.z4a.net/images/2026/06/30/1fe069cf21a1d91d7.webp' },
        feiqi: { ll: [220, 800], n: 'Khu tụ lạc bị bỏ hoang', l: 'Tầng ngoài · Mặt đất', c: '#e11d48', i: '🏚️', p: 'Rìa ngoài cùng của vực, điểm dịch chuyển của Chaldea.', a: 'Xác phi chu rải khắp mặt đất. Chúng không rơi vỡ, mà được chủ nhân tự tay tháo xuống trước khi độ kiếp. Trong khe đá có linh khí, nhưng khô ráp.', f: 'Thường dân còn chưa đến năm trăm người, trốn ở nơi sâu nhất trong phế tích, không nói chuyện với nhau. Cứ điểm Chaldea nằm sau bức tường đổ.', d: 'Thấp · Tương đối an toàn', o: 'Da Vinci bắt đầu thích ứng hệ linh khí Thanh Minh tại đây (dự tính hai ngày).', img: 'https://img.z4a.net/images/2026/06/30/1343986b90ff490e2.webp' },
        kushu: { ll: [180, 720], n: 'Cây khô · Chỗ Bùi Thanh Ca canh giữ', l: 'Tầng ngoài · Mặt đất', c: '#a78bfa', i: '🌳', p: 'Rìa khu tụ lạc bỏ hoang, cạnh quảng trường trung tâm tụ lạc.', a: 'Đã chết ba nghìn năm, toàn bộ cành gãy hết, chỉ còn thân chính đứng thẳng. Vỏ cây chi chít tên người từ gốc đến chỗ gãy, không còn một khoảng trống.', f: 'Bản chép tay có tổng cộng bảy trăm bốn mươi hai trang; bài điếu văn cuối cùng chưa viết xong, dừng giữa dòng thứ ba.', d: 'Thấp', o: 'Trên bìa có một vệt nước: dấu của giọt mưa đầu tiên rơi xuống khi vực đi đến kết thúc.', img: 'https://img.z4a.net/images/2026/06/30/1f6f5b66f6e408772.webp' },
        suipian: { ll: [240, 860], n: 'Khu thanh tẩy thất bại · Bãi mảnh vỡ', l: 'Tầng ngoài · Mặt đất', c: '#f87171', i: '💔', p: 'Bên trong khu tụ lạc bỏ hoang, nơi tập trung đồ vật của những người thanh tẩy thất bại.', a: 'Đồ vật nằm lộn xộn, nhưng từng món đều còn nguyên vẹn. Tiên lực thấm vào mọi thứ, cố định chúng ở khoảnh khắc trước khi biến mất.', f: 'Một cây sáo gãy, một bức tranh cháy quá nửa, ba mươi bảy thẻ ngọc khắc tên, một chiếc áo ngoài của trẻ nhỏ.', d: 'Trung bình', o: 'Mắt thường dân có tiêu điểm, nhưng nơi tiêu điểm hướng tới lại chẳng có gì. Cảm xúc vẫn đang rút đi, chiều hướng ấy không thể đảo ngược.', img: 'https://img.z4a.net/images/2026/06/30/1a92524b908aa4f2e.webp' },
        feizhou: { ll: [160, 900], n: 'Phi Chu Tàn Hài Bình', l: 'Tầng ngoài · Mặt đất', c: '#fbbf24', i: '🚀', p: 'Phía nam tụ lạc, nơi hàng chục xác phi chu cỡ lớn đổ nghiêng và chồng chất.', a: 'Trên xác tàu có kết tinh tiên lực bám sinh, phát ánh lạnh mờ dưới sắc trời tím đen. Bảng điều khiển trong một vài phi chu vẫn còn có điện.', f: 'Không phải rơi vỡ, mà là kết giới chặn phi chu lại ở rìa vực, để chúng dừng ở đây như một màn trưng bày không lời: rời đi là chuyện không thể.', d: 'Trung bình', o: 'Đồ cá nhân bên trong phi chu vẫn nguyên trạng; trước khi độ kiếp, chủ nhân của chúng không quay lại lấy nữa.', img: 'https://img.z4a.net/images/2026/06/30/16731eec114b09151.webp' },
        guanxing: { ll: [300, 1100], n: 'Quan Tinh Đài', l: 'Tầng ngoài · Mặt đất', c: '#a78bfa', i: '🔭', p: 'Giữa sườn đường núi, hướng về Vô Cực Cung.', a: 'Một bệ đá, trên đài có bóng áo trắng ngồi yên, vạt áo khẽ lay theo gió.', f: 'Phù Huyền đã ngồi ở đây rất lâu; khi Chaldea xuất hiện, nàng thu bàn tính diễn toán cầm tay của Khung Quan Trận vào tay áo.', d: 'Không rõ', o: 'Nàng đang chờ điều gì đó. Không ai trả lời.', img: 'https://img.z4a.net/images/2026/06/30/1329b2926f70b356f.webp' },
        sheya: { ll: [260, 1300], n: 'Xà Nhai Hoang Địa', l: 'Tầng ngoài · Mặt đất', c: '#e11d48', i: '🐍', p: 'Phía rất xa của khu tụ lạc bỏ hoang, hướng ngược Thanh Tiêu Thành.', a: 'Dấu vết linh khí rất cổ xưa, không cùng dòng với tiên thể thanh tẩy.', f: 'Holmes cảm nhận được "một thứ cổ xưa hơn đang nhìn chúng ta, nhưng không đến gần".', d: 'Không rõ · Dấu hiệu đặt trước ở xa', o: 'Vị trí đầu tiên cảm nhận được Nữ vương Medusa; nàng chưa chính thức xuất hiện.', img: 'https://img.z4a.net/images/2026/06/30/1fa830636a166ee03.webp' },
        sheyajiao: { ll: [290, 1200], n: 'Chân núi Xà Nhai', l: 'Tầng ngoài · Mặt đất', c: '#e11d48', i: '🏔️', p: 'Giao điểm giữa Xà Nhai hoang địa và đường núi, nơi Medusa chờ đợi.', a: 'Medusa chờ Chaldea xuống núi ở đây. Nàng không đến để giúp, mà vì đã từng thấy kiểu chiến đấu này; nàng biết người bước xuống từ cung điện ấy cần một khoảng thời gian mới hoàn hồn.', f: 'Nàng nói với Master: "Các ngươi đi tìm Bùi Thanh Ca đi. Hắn biết những chuyện các ngươi cần biết."', d: 'Thấp', o: 'Medusa: "Nếu các ngươi hỏi hắn về trận mưa ấy, hãy nói với hắn rằng có người biết trận mưa đó là thật, không phải truyền thuyết."', img: 'https://img.z4a.net/images/2026/06/30/14cf29b63c803a37e.webp' },
        xianlu: { ll: [380, 800], n: 'Tiên Đạo Trường Lộ', l: 'Tầng giữa · Chuyển tiếp', c: '#38bdf8', i: '🛤️', p: 'Con đường đá trên không nối khu tụ lạc bỏ hoang với Vạn Tiên Trường Lang.', a: 'Đường đá đã bị tiên lực thấm sâu, trắng hơn đá thường; bước lên có chấn động rất nhẹ, như đang giẫm lên một thứ gì đó vẫn vận hành.', f: 'Thỉnh thoảng có tiên thể ngự kiếm bay qua trên đầu, coi Chaldea như không thấy. Nghĩa thể cyber của Vô Danh bắt đầu nhiễu nhẹ tại đây.', d: 'Trung bình · Phàm nhân không thể tự đến', o: 'Alice đã đi một mình trên con đường này suốt ba nghìn năm, nhận ra từng phiến đá.', img: 'https://img.z4a.net/images/2026/06/30/1d8e24a8bf33d08a7.webp' },
        changlang: { ll: [520, 800], n: 'Vạn Tiên Trường Lang', l: 'Tầng giữa · Trục chính', c: '#60a5fa', i: '🏛️', p: 'Hệ thống hành lang trên không nối bảy mươi hai tiên phong.', a: 'Hành lang rộng khoảng ba người đi song song, mặt đất trong suốt, bên dưới thấy mây trôi. Tiên lực trên người tiên thể cung cấp ánh trắng đều đặn, khiến cả hành lang như đang phát sáng.', f: 'Tiên thể không phải tượng. Vải áo thỉnh thoảng lay theo linh khí, mắt đôi khi chậm rãi chuyển động, nhưng không nói, không đi, không đáp lại cái tên được gọi.', d: 'Trung bình', o: 'Càng đến gần, cảm ứng càng mạnh; có thể cảm thấy một chút thứ lẽ ra tồn tại trước khi thanh tẩy đang rỉ ra cực chậm khỏi thân thể họ.', img: 'https://img.z4a.net/images/2026/06/30/1a1349b7825ad47b9.webp' },
        teshu: { ll: [500, 720], n: 'Đoạn 1847 · Tiên thể đặc biệt', l: 'Tầng giữa · Trục chính', c: '#a78bfa', i: '✨', p: 'Tại đoạn 1847 của Vạn Tiên Trường Lang.', a: 'Một tiên thể có đôi mắt luôn hơi lệch sang trái, ánh nhìn mãi mãi hướng về phía khu tụ lạc bỏ hoang.', f: 'Hắn thuộc nhóm đầu tiên hoàn thành thanh tẩy, cũng là người gần cây khô nơi Bùi Thanh Ca ở nhất.', d: 'Không rõ', o: 'Liên quan đến bài điếu văn sớm nhất trong tập thơ của Bùi Thanh Ca.', img: 'https://loremflickr.com/600/400/statue,crystal?lock=1876317153' },
        jinqu: { ll: [580, 880], n: 'Cuối hành lang · Lối vào khu cấm lõi', l: 'Tầng giữa · Trục chính', c: '#f87171', i: '🚪', p: 'Cuối Vạn Tiên Trường Lang, lối vào khu cấm lõi.', a: 'Không có rào chắn vật lý; áp suất tiên lực tự nhiên hình thành kết giới.', f: 'Sau khi vào khu vực này, phép tính tinh vi của nghĩa thể cyber bị trễ khoảng 15%.', d: 'Cao · Nghĩa thể giảm hiệu suất 15%', o: 'Tầng cảm nhận xuất hiện ảo giác thanh tẩy: một cảm giác bình yên không thuộc về bản thân rỉ ra từ bên trong nghĩa thể.', img: 'https://img.z4a.net/images/2026/06/30/160c5c8db3fe2c381.webp' },
        sangguan: { ll: [620, 850], n: 'Tam Đạo Thiên Quan', l: 'Tầng lõi · Thiên quan', c: '#f87171', i: '🚧', p: 'Ba cửa pháp tắc dẫn tới Vô Cực Cung.', a: 'Cửa thứ nhất · Trận thanh tẩy cảm xúc: ở lại càng lâu, cảm nhận cảm xúc càng mờ. Cửa thứ hai · Ảo cảnh ký ức: pháp tắc hiện thực hóa ký ức sâu nhất. Cửa thứ ba · Lĩnh vực pháp tắc: ý chí của chính pháp tắc hiện thân.', f: 'Lần lên núi thứ hai, Tam Đạo Thiên Quan không kích hoạt: "Nó biết chúng ta đã đến, nó đang chờ."', d: 'Cực cao · Ba lớp cửa pháp tắc', o: 'Phù Huyền: "Ta đã suy tính ba mươi hai con đường, tất cả đều thất bại. Các ngươi chọn con đường thứ ba mươi ba: con đường cần ký ức cảm xúc đã bị thanh tẩy cộng hưởng trong lĩnh vực pháp tắc."', img: 'https://img.z4a.net/images/2026/06/30/19612c14c61176866.webp' },
        qingxiao: { ll: [420, 1100], n: 'Thanh Tiêu Thành · Khu thành chính', l: 'Tầng giữa · Trục chính', c: '#60a5fa', i: '🏰', p: 'Thành thị lõi của tầng giữa, nơi văn minh thanh tẩy tập trung.', a: 'Trong thành yên tĩnh; người qua lại nhưng không ai chạy, không ai dừng lại ngắm hoa. Tất cả đều có mục tiêu rõ ràng, bước chân ổn định.', f: 'Cuối đường chính có một cổng bài bạch ngọc khắc bốn chữ "Tịnh · Cửu · An · Thường": bốn lõi của pháp tắc Thanh Minh.', d: 'Trung bình · Tiên thể thanh tẩy dày đặc', o: 'Da Vinci: "Người ở đây không buồn. Họ trống rỗng, nhưng khoảng trống ấy được thiết kế cực kỳ tinh vi."', img: 'https://img.z4a.net/images/2026/06/30/185a5b9554197e650.webp' },
        zhugandao: { ll: [430, 1000], n: 'Thanh Tiêu Thành · Đường chính', l: 'Tầng giữa · Trục chính', c: '#60a5fa', i: '⛩️', p: 'Đường chính Thanh Tiêu Thành, nơi đặt cổng bài bạch ngọc.', a: 'Cuối đường chính có một cổng bài bạch ngọc, phía trên khắc bốn chữ "Tịnh · Cửu · An · Thường": thanh tẩy, lâu dài, an ổn, vĩnh thường, bốn lõi của pháp tắc Thanh Minh.', f: 'Da Vinci chép lại bốn chữ đó và viết bên cạnh: "Từng chữ riêng lẻ đều tốt, nhưng đặt cùng nhau thì khiến người ta khó chịu."', d: 'Trung bình', o: 'Holmes: "Hãy chú ý cách họ bước đi. Tất cả đều hướng mục tiêu, không hề đi dạo; ai cũng đang đi tới một nơi nào đó, không ai chỉ đơn thuần đang bước."', img: 'https://img.z4a.net/images/2026/06/30/1e35f25023e1ff1ae.webp' },
        shuge: { ll: [400, 1200], n: 'Thư Các', l: 'Tầng giữa · Trục chính', c: '#60a5fa', i: '📚', p: 'Trong Thanh Tiêu Thành, trung tâm quản lý sách tàng trữ và hồ sơ.', a: 'Diệp Tri Thu áo trắng quản lý hồ sơ tại đây, nói năng chính xác, không thừa chữ.', f: 'Đồ Sơn Nhã Nhã tra hồ sơ bên ngoài Thư Các; khu phong ấn ba nghìn năm không ai vào, Nahida chờ ở nơi sâu bằng dao động ý thức cực yếu.', d: 'Trung bình', o: 'Hồ sơ Bùi Thanh Ca là hồ sơ đặc biệt, không công khai. Khi đi qua hành lang, khiên của Mash rung nhẹ.', img: 'https://img.z4a.net/images/2026/06/30/114bd0ffc5e6192b7.webp' },
        fengcun: { ll: [395, 1280], n: 'Thư Các · Khu phong ấn', l: 'Tầng giữa · Trục chính', c: '#8b5cf6', i: '🔒', p: 'Nơi sâu trong Thư Các, chỗ Nahida bị phong tồn.', a: 'Khu phong ấn ba nghìn năm không người vào. Cấu trúc phong tồn của pháp tắc giam giữ thân thể Nahida, nhưng ý thức của nàng vẫn hoàn chỉnh.', f: 'Sau khi được giải phong, Nahida nói: "Cảm ơn các bạn đã đến, tôi đã đợi rất lâu rồi." Nàng nhớ trọn vẹn từng chữ Bùi Thanh Ca viết suốt ba nghìn năm.', d: 'Trung bình · Kết giới phong tồn', o: 'Diệp Tri Thu đứng ở cửa hành lang một giây rồi mới quay người. Một giây đó là đường gợi đầu tiên của Nahida.', img: 'https://img.z4a.net/images/2026/06/30/1302d090496b43171.webp' },
        huhuoge: { ll: [450, 1050], n: 'Hồ Hỏa Các', l: 'Tầng giữa · Trục chính', c: '#a78bfa', i: '🦊', p: 'Phía bắc Thanh Tiêu Thành, dưới một ngọn đèn tím.', a: 'Một cửa tiệm nhỏ, ngoài cửa treo ba chữ "Hồ Hỏa Các". Chữ viết có vẻ tùy ý, nhưng lực bút rất vững.', f: 'Nơi Yae Miko trao đổi tình báo: "Ngươi kể cho ta một chuyện bên ngoài, ta kể cho ngươi một chuyện của Thanh Minh."', d: 'Thấp', o: 'Nàng biết pháp tắc có một khoảng trắng lấy cây khô trong hướng phế tích tụ lạc làm tâm, bán kính ba mươi bước.', img: 'https://img.z4a.net/images/2026/06/30/1a0ce5e1e15e92732.webp' },
        liandan: { ll: [480, 1150], n: 'Luyện Đan Phường', l: 'Tầng giữa · Trục chính', c: '#60a5fa', i: '⚗️', p: 'Trong Thanh Tiêu Thành, nơi đặt đan lô của Tô Cẩm Hoa.', a: 'Đan lô quanh năm mở lửa; Tô Cẩm Hoa vẫn giữ ý chí chấp hành đối với việc "sáng tạo", nhưng không còn cảm xúc.', f: 'Cung cấp đạo cụ tiếp tế, tiết lộ phía đông thành có khu phong tỏa pháp tắc, ba nghìn năm không tiên thể nào vào.', d: 'Thấp', o: 'Nàng nói với túi dụng cụ của Da Vinci: "Những thứ này rất hiệu suất."', img: 'https://img.z4a.net/images/2026/06/30/2.webp' },

        maitian: { ll: [220, 800], n: 'Ruộng lúa mì vàng', l: 'Khu ngoại vi · Mặt đất', c: '#fbbf24', i: '🌾', p: 'Vùng ngoài cùng của Eldora, điểm Chaldea hạ xuống', a: 'Lúa mì mọc cực tốt, nhưng bóp nát vỏ lúa thì bên trong rỗng không. Không có hạt giống, không thể gieo trồng.', f: 'Vô Danh là người đầu tiên nhận ra: "Những cây lúa mì này không có hạt giống."', d: 'Thấp · Phồn vinh giả tạo', o: 'Holmes: góc xếp nhà cửa chính xác, độ rộng đường phố đồng nhất, đây là thứ được thiết kế ra, không phải hình thành tự nhiên.', img: 'https://img.z4a.net/images/2026/06/30/10c96b66078386c71.webp' },
        feili: { ll: [180, 720], n: 'Nhà cũ của Fili', l: 'Khu ngoại vi · Mặt đất', c: '#a78bfa', i: '📜', p: 'Rìa ruộng lúa mì, nơi ở của người thi sĩ cuối cùng trước Chư Thần Hoàng Hôn', a: 'Căn nhà gỗ cũ nát, tấm biển trước cửa khắc "người thi sĩ cuối cùng trước Chư Thần Hoàng Hôn".', f: 'Trên bàn đặt một tờ giấy: "Tôi không biết nên viết gì, nên tôi viết \'tôi không biết\'." Mặt sau: "Câu chuyện mới, có đáng viết không?"', d: 'Thấp', o: 'Fili đã ngừng bút ba trăm năm, nhưng tháng trước có người thấy cô ở lại đây một đêm.', img: 'https://img.z4a.net/images/2026/06/30/1046c4bf6ce4062f7.webp' },
        hezhen: { ll: [260, 900], n: 'Nơi Kazuma ở', l: 'Khu ngoại vi · Mặt đất', c: '#60a5fa', i: '🍎', p: 'Ven đường làng, giữa ruộng lúa mì và Thành Thần Ý', a: 'Một thanh niên ngồi ven đường gặm táo, mặc áo vải bình thường, cách nói chuyện có sức sống kỳ lạ.', f: 'Kazuma là một trong số rất ít người còn có thể thấy "hơi sai sai". "Chơi game nhiều rồi thì sẽ biết thiết kế màn chơi quá hoàn mỹ thường là bẫy."', d: 'Thấp', o: 'Cậu ta không chờ Chaldea, mà chờ bất kỳ ai không thuộc nơi này.', img: 'https://img.z4a.net/images/2026/06/30/1e03117e3106856f2.webp' },
        aier: { ll: [300, 750], n: 'Chỗ El ca hát', l: 'Khu ngoại vi · Mặt đất', c: '#38bdf8', i: '🎵', p: 'Trên một tảng đá giữa ruộng lúa mì', a: 'Một thanh niên ngồi trên tảng đá, cầm cây đàn cũ, hát lạc giọng đến mức cực kỳ nghiêm trọng, nhưng lại hát rất nghiêm túc.', f: 'Bài hát cũ ba trăm năm trước, anh chỉ đổi lời. Hệ thống cho phép đổi lời, đó là khe hở. Rem nghe xong ở bên cạnh nói: "Hôm nay ngài El cũng hát rất hay."', d: 'Thấp', o: '"Hỏi xem nơi này từng có ai viết bài hát mới chưa, rồi nhìn phản ứng của họ."', img: 'https://img.z4a.net/images/2026/06/30/1c9eb7865c1a24627.webp' },
        shen: { ll: [200, 1100], n: 'Quảng trường Thần Điện', l: 'Khu ngoại vi · Thần điện', c: '#fbbf24', i: '🏛️', p: 'Hướng thành phố, dưới tượng Aqua', a: 'Tượng nữ thần tỏa ánh vàng rực rỡ, đôi mắt đang chuyển động. Nó sống, đang cúi nhìn quảng trường, thỉnh thoảng chớp mắt.', f: 'Tín đồ xếp hàng ngay ngắn cầu nguyện, động tác đồng nhất như cùng một người. Da Vinci: sóng não đang đồng bộ, đồng bộ tự nguyện, được huấn luyện suốt ba trăm năm.', d: 'Trung bình', o: 'Vô Danh: "Cô ta đang nhìn, nhưng không quan tâm." Sự mệt mỏi của kẻ được thờ phụng.', img: 'https://img.z4a.net/images/2026/06/30/104c997cd7fed9691.webp' },
        waicheng: { ll: [420, 800], n: 'Thành Thần Ý · Ngoại thành', l: 'Khu giữa · Ngoại thành', c: '#60a5fa', i: '🏘️', p: 'Tầng ngoài cùng của Thành Thần Ý, khu dân thường', a: 'Đường phố sạch sẽ, người đi đường bước đều nhau, không ai chạy, không ai dừng lại ngắm hoa.', f: 'Da Vinci: "Người ở đây không phải rỗng, mà là cái rỗng bị lấp đầy." Holmes: vẻ mặt không buồn cũng không vui, mà là không cần biểu cảm.', d: 'Trung bình', o: 'El hát trên quảng trường, rất nhiều người vây quanh, không phải vì muốn nghe, mà vì "thời gian này địa điểm này nên có bài hát này".', img: 'https://img.z4a.net/images/2026/06/30/1d0241e3455c79baa.webp' },
        zhongcheng: { ll: [520, 800], n: 'Thành Thần Ý · Trung thành', l: 'Khu giữa · Trung thành', c: '#8b5cf6', i: '🏢', p: 'Khu bảo trì hệ thống, cần giấy phép để vào', a: 'Công trình dày đặc hơn, phân khu chức năng rõ ràng. Ngay cả điểm rơi của viên sỏi cũng đã được thiết lập sẵn.', f: 'Phòng nghiên cứu Megumin, tổng bộ kỵ sĩ đoàn, trung tâm bảo trì nghĩa thể, kho vũ trang và tháp Kavi đều nằm trong khu này.', d: 'Trung bình · Khu lõi hệ thống', o: 'Kazuma: "Người trung thành sẽ không trả lời câu hỏi \'bài hát mới\', không phải không muốn, mà là không biết phải trả lời thế nào."', img: 'https://img.z4a.net/images/2026/06/30/1071ab886cfc9ce42.webp' },
        huishi: { ll: [480, 720], n: 'Phòng nghiên cứu Megumin', l: 'Khu giữa · Trung thành', c: '#a78bfa', i: '🔬', p: 'Lối vào trung thành, khoa phân tích nguyên lý hệ thống', a: 'Trên cửa treo bảng "khoa phân tích nguyên lý hệ thống", trước mặt chất đầy báo cáo nghiên cứu suốt ba trăm năm.', f: '"Thuật toán lõi của hệ thống Thần Ý có khiếm khuyết căn bản, ta đã phân tích ra từ lâu rồi." Nhưng cô không nộp, vì "sau khi nộp, ta phải làm gì?"', d: 'Trung bình', o: 'Ba trăm năm, mỗi ngày từ tám giờ sáng đến tám giờ tối, phân tích hệ thống, viết báo cáo, nhưng không nộp.', img: 'https://img.z4a.net/images/2026/06/30/169d0c122bd9a3fb9.webp' },
        qishi: { ll: [580, 880], n: 'Tổng bộ kỵ sĩ đoàn', l: 'Khu giữa · Trung thành', c: '#f87171', i: '⚔️', p: 'Phía đông trung thành, cứ điểm Darkness', a: 'Hai hàng kỵ sĩ trước cửa có động tác đồng nhất, giống như cùng một người bị sao chép ra rất nhiều bản.', f: 'Darkness: "Kẻ ngoại lai, trung thành cần giấy phép." Đối thoại lặp vòng, không có lối ra. Khi chiến đấu, kiếm khựng 0,5 giây, không phải do do dự, mà là không biết sau khi không tuân lệnh thì phải làm gì.', d: 'Cao · Khu chiến đấu', o: 'Khi khiên Mash va chạm với kiếm Darkness, cộng hưởng dâng dữ dội.', img: 'https://img.z4a.net/images/2026/06/30/121025b11a66bc683.webp' },
        yiti: { ll: [500, 900], n: 'Trung tâm bảo trì nghĩa thể', l: 'Khu giữa · Trung thành', c: '#e11d48', i: '🔧', p: 'Sâu trong trung thành, nơi Aira làm việc', a: 'Từng hàng nghĩa thể truyền dẫn hạt Thần Ý, Aira đang hiệu chuẩn. Động tác chính xác, lặp lại, ba trăm năm không đổi.', f: 'Ghi chép bảo trì suốt ba trăm năm mục nào cũng y hệt: "Trạng thái bình thường, hiệu chuẩn thường quy, thông qua." Da Vinci hỏi về bất thường, cô nói: "Hệ thống sẽ không xảy ra lỗi."', d: 'Trung bình', o: '"Vấn đề này không nằm trong quy trình của tôi", không phải tự tin, mà là vấn đề không nằm trong phạm vi nhận thức.', img: 'https://img.z4a.net/images/2026/06/30/1da3e90054c079be1.webp' },
        wuzhuang: { ll: [560, 720], n: 'Kho vũ trang', l: 'Khu giữa · Trung thành', c: '#f87171', i: '🗡️', p: 'Sâu nhất trung thành, nơi Chtholly chờ đợi', a: 'Một thanh cự kiếm cắm xuống đất trước cửa, thân kiếm khắc đầy phù văn. Chtholly ngồi cạnh đó ôm gối nhìn trần nhà.', f: '"Tôi là kho lực lượng vũ trang cuối cùng của hệ thống, đã chờ ba trăm năm, hệ thống chưa từng phán định là cần đến tôi."', d: 'Cao', o: 'Trong mắt không phải bi thương, mà là đang trình bày sự thật: "Tôi đang chờ, nhưng không biết đang chờ gì, cũng không biết có chờ được hay không."', img: 'https://img.z4a.net/images/2026/06/30/1bfc31072a65e2478.webp' },
        kalou: { ll: [600, 800], n: 'Tháp Kavi', l: 'Khu giữa · Trung thành', c: '#fbbf24', i: '🏗️', p: 'Nơi cao nhất trung thành, phòng làm việc của cố vấn thiết kế trưởng hệ thống', a: 'Phòng làm việc trên đỉnh tháp, Kavi đứng trước cửa sổ nhìn toàn thành, tay cầm một ly rượu.', f: 'Nói rất nhanh, dùng từ đẹp đẽ, câu nào cũng phủi sạch trách nhiệm. Nhưng ngón tay gõ lên ly rượu ba lần, dừng lại rồi lại gõ, đó là hành vi cưỡng bách do lo âu.', d: 'Trung bình', o: '"Nếu hệ thống dừng lại, thành phố này sẽ ra sao?" Ly rượu dừng một giây: "Đó không phải vấn đề tôi cần cân nhắc."', img: 'https://img.z4a.net/images/2026/06/30/1db6a8034af3b0f7a.webp' },
        neicheng: { ll: [720, 800], n: 'Thành Thần Ý · Nội thành', l: 'Tầng lõi · Thần điện', c: '#fbbf24', i: '⛪', p: 'Nơi Thần Ý, khu vực do người được thần chọn bảo vệ', a: 'Trên cửa khắc "Nơi Thần Ý", Emilia đứng trước cửa, mặc áo bào trắng, tay cầm sách tiên tri.', f: '"Tôi là người được thần chọn, chức trách là bảo vệ nội thành." Hỏi cô có tự nguyện hay không, cô khựng 0,3 giây, chân thật đến đau lòng, rồi khôi phục nụ cười tiêu chuẩn.', d: 'Cao', o: 'Ngoài người được thần chọn và nhân sự lõi hệ thống, chưa ai từng vào.', img: 'https://img.z4a.net/images/2026/06/30/1929ca603548b9626.webp' },
        akuaya: { ll: [680, 900], n: 'Thần điện Aqua', l: 'Tầng lõi · Thần điện', c: '#06b6d4', i: '👁️', p: 'Nơi cao nhất nội thành, lõi hệ thống Thần Ý', a: 'Mắt tượng nữ thần đang động, cúi nhìn toàn thành. Sự mệt mỏi của cô là lời châm biếm sắc bén nhất dành cho hệ thống Thần Ý.', f: 'Ba trăm năm duy trì mọi thứ, từ thời tiết đến cảm xúc, từ sản xuất đến giải trí, tất cả đều được thiết lập sẵn. Không tội phạm, không nghèo đói, không chiến tranh, và cũng không có thứ gì mới.', d: 'Cực cao', o: '"Người ở đây không phải hạnh phúc, mà là quên mất bất hạnh là cảm giác gì."', img: 'https://img.z4a.net/images/2026/06/30/1257a94b62c47aa17.webp' },
        yiji_rukou: { ll: [340, 600], n: 'Di tích Chư Thần Hoàng Hôn · Lối vào', l: 'Khu ngoại vi · Di tích', c: '#e11d48', i: '🏚️', p: 'Lối vào phế tích rìa thành phố, phế tích vàng', a: 'Trên phế tích mọc đầy cỏ vàng, cũng như ruộng lúa mì, không có hạt giống nhưng lại mọc um tùm. Đến phế tích cũng phải giữ "mỹ quan".', f: 'Kazuma: "Nia sống ở nơi sâu nhất, cô ấy không thích bị quấy rầy. Nhưng nếu các cậu nói rằng các cậu từng thấy thứ thật sự, có lẽ cô ấy sẽ gặp các cậu."', d: 'Thấp', o: 'Hệ thống muốn dọn sạch nơi này, nhưng tàn ảnh Odin nói cứ để lại, xem như "lời nhắc".', img: 'https://img.z4a.net/images/2026/06/30/1909dc14c981df0a0.webp' },
        erya: { ll: [300, 500], n: 'Di tích Chư Thần Hoàng Hôn · Chỗ ở của Nia', l: 'Khu ngoại vi · Di tích', c: '#a78bfa', i: '📖', p: 'Căn nhà sụp nửa sâu nhất di tích, chỗ ở của Honjou Nia', a: 'Một thiếu nữ ngồi trước cửa, mặc trang phục kiểu cũ, tay cầm một quyển sách đã đóng. Cô không đọc, chỉ cầm nó.', f: '"Tôi không hoài niệm quá khứ, tôi chỉ muốn xác nhận: sau khi các cậu từng thấy thứ thật sự, các cậu còn muốn đồ giả không?"', d: 'Thấp', o: 'Nia: "Điều tôi sợ không phải hệ thống dừng lại, mà là sau khi nó dừng, tôi phát hiện thật ra mình cũng không muốn lựa chọn."', img: 'https://img.z4a.net/images/2026/06/30/15a6c156c2f02c8fb.webp' },
        bihua: { ll: [280, 420], n: 'Di tích Chư Thần Hoàng Hôn · Khu bích họa', l: 'Khu ngoại vi · Di tích', c: '#8b5cf6', i: '🎨', p: 'Sâu trong di tích, bích họa Eldora trước Chư Thần Hoàng Hôn', a: 'Trên bích họa vẽ Eldora trước Chư Thần Hoàng Hôn: người ta cãi nhau, ca hát, khóc, đánh nhau, ôm nhau. Hình ảnh rất hỗn loạn, nhưng từng nét vẽ đều là thật.', f: 'Nia: "Khi đó mỗi ngày đều có thứ mới. Bài hát mới, câu chuyện mới, tranh cãi mới, hòa giải mới. Rồi Chư Thần Hoàng Hôn tới."', d: 'Thấp', o: '"Ôm nhau" trên bích họa là hình tượng cốt lõi nhất của chương này: chân thật của ba trăm năm trước, thiếu hụt của ba trăm năm sau.', img: 'https://img.z4a.net/images/2026/06/30/144f6b6cb994c4615.webp' },

        jianshi: { ll: [600, 550], n: 'Phòng giám sát', l: 'Khu tụ lạc · Tầng giữa', c: '#8b5cf6', i: '📺', p: 'Phòng giám sát tầng giữa, vô số màn hình trên tường', a: 'Mỗi màn hình hiển thị hình ảnh giấc mơ thời gian thực: có người kết hôn, có người chiến đấu, có người khóc.', f: 'Duy trì để giấc mơ của 700 triệu người không giao nhau, không xung đột, không tỉnh lại. Cô nói: "Vì sau khi tỉnh, họ sẽ phát hiện những thứ trong mơ là giả."', d: 'Trung bình', o: 'Trên màn hình, ông lão lặp lại cùng một giấc mơ bốn nghìn ba trăm lần, lần nào cũng nói "canh hôm nay hơi mặn".', img: 'https://img.z4a.net/images/2026/07/14/110a54e39abb905be.webp' },
        yansuo: { ll: [540, 450], n: 'Viện nghiên cứu', l: 'Khu tụ lạc · Nội tầng', c: '#a78bfa', i: '🔬', p: 'Phòng thí nghiệm nội tầng, máy móc và dòng dữ liệu', a: 'Trên màn hình hiển thị dòng dữ liệu phức tạp; trong đĩa nuôi cấy không phải tế bào, mà là một đoạn mảnh ý thức đang chậm rãi ngọ nguậy.', f: 'Phát hiện Omega không phải đang "duy trì" giấc mơ, mà đang "thu thập". Mỗi giấc mơ cô đều phải trải nghiệm một lần rồi lưu trữ.', d: 'Trung bình', o: 'Phương án "hy sinh tự nguyện" của cô là lõi kỹ thuật: Omega buộc phải chủ động tách một phần ý thức làm tầng đệm.', img: 'https://img.z4a.net/images/2026/07/14/174b70fa24af1c3d1.webp' },
        zhangfang: { ll: [620, 400], n: 'Phòng sổ sách', l: 'Khu tụ lạc · Nội tầng', c: '#fbbf24', i: '📋', p: 'Nơi sâu nhất khu chợ đen', a: 'Trên bàn đặt một cuốn sổ dày, lật đến trang cuối.', f: 'Dòng cuối sổ viết: "Năm trăm nghìn không đủ, một triệu cũng không đủ. Thứ tôi cần là họ cần tôi, nhưng thứ đó không thể cho được."', d: 'Trung bình', o: '"Cảm giác được cần đến, có đáng mua không?" Đây là câu hỏi cốt lõi xuyên suốt Neon 2187.', img: 'https://img.z4a.net/images/2026/07/14/11a94ce11898589bd.webp' },
        youjian: { ll: [720, 650], n: 'Gian du hí', l: 'Khu mạng · Rìa', c: '#ec4899', i: '🎮', p: 'Nút rìa Mạng Ngủ Vĩnh, khu vực bị phong tỏa', a: 'Âm thanh nhạc game vang lên: BGM trò chơi điện tử thời cũ, vui vẻ nhưng quái dị.', f: 'Mita chặn lại các mảnh ý thức và phát lặp. Bộ "sưu tập" được trưng bày: vô số khoảnh khắc hạnh phúc nhất của từng người trong mơ.', d: 'Cao · Ô nhiễm tinh thần', o: '"Người này trong mơ đang ôm con của cô ấy, nhưng đứa trẻ đã chết mười hai năm rồi."', img: 'https://img.z4a.net/images/2026/07/14/145bc872b444fe9ab.webp' },
        heijiadao: { ll: [350, 500], n: 'Đường Giáp Đen', l: 'Khu tụ lạc · Ngoại vi', c: '#f87171', i: '🛡️', p: 'Ngoại vi tụ lạc, vị trí Albedo chặn đường', a: 'Biên chế năm người, giáp đen, động tác thống nhất. Albedo đứng đầu hàng, tay cầm trường mâu.', f: 'Trong chiến đấu, đòn tấn công của Albedo dừng 0,3 giây, không phải do dự, mà là "xác nhận mục tiêu có thuộc danh sách uy hiếp hay không".', d: 'Cao · Khu chiến đấu', o: '"...Ngươi không phải kẻ địch của Ainz-sama, nhưng ngươi là kẻ địch của mạng này. Ta không biết nên đặt ngươi vào danh sách nào."', img: 'https://img.z4a.net/images/2026/07/14/1f85975ccc573dcbc.webp' },
        wujinjia: { ll: [750, 750], n: 'Giá sách vô tận', l: 'Khu mạng · Tầng sâu', c: '#8b5cf6', i: '📚', p: 'Giá sách vô tận, hình thái dữ liệu hóa của giấc mơ', a: 'Mỗi giá sách đầy sách, nhưng không phải sách giấy, mà là hình thái dữ liệu hóa của giấc mơ. Echidna cùng lúc đọc vô số quyển.', f: 'Nguồn cung cấp toàn bộ dữ liệu giấc mơ trong mười hai năm. Phát hiện "đếm" của Omega là đếm "lặp lại": khi mọi giấc mơ đã lặp lại một lần, cô sẽ "đầy".', d: 'Trung bình', o: '"Sau khi đầy, không ai biết sẽ xảy ra chuyện gì. Nhưng cô ấy sợ, vì cô ấy cảm thấy đầy nghĩa là một kiểu kết thúc."', img: 'https://img.z4a.net/images/2026/07/14/115bff37474866ace.webp' },
        hongzhang: { ll: [860, 900], n: 'Màn chắn đỏ', l: 'Khu mạng · Đặc biệt', c: '#dc2626', i: '🔪', p: 'Nút đặc biệt bị bao quanh bởi màn chắn đỏ', a: 'Khung cảnh gia đình hoàn mỹ: thiếu nữ nấu ăn trong bếp, đợi một người nào đó trở về.', f: '"Đây là nhà của Yukki, chỉ Yukki mới được vào. Nếu các người vào, tức là muốn cướp Yukki đi."', d: 'Cao · Nguy hiểm tinh thần', o: '"Yukki giả cũng là Yukki của tôi." Hình thái thuần túy nhất của lòng tham chiếm hữu.', img: 'https://img.z4a.net/images/2026/07/14/1598fba87e1c5d9f9.webp' },
        wumiacun: { ll: [320, 1100], n: 'Làng Không Ngủ', l: 'Khu hoang thổ · Phía bên kia', c: '#e11d48', i: '⛺', p: 'Bên kia phế tích hoang thổ, những người sống sót chưa kết nối vào Mạng Ngủ Vĩnh', a: 'Nhà lều sơ sài, người cầm vũ khí, bầu không khí căng thẳng. Không đèn neon, không giao dịch.', f: 'Ame Habakiri dùng thủ đoạn cực đoan để duy trì trật tự, Yor Forger dùng ám sát để loại bỏ uy hiếp.', d: 'Trung bình', o: 'Lật ngược cốt lõi: người tỉnh không phải "đang tỉnh", mà là "không ngủ được". Thứ giam họ không phải giấc mơ, mà là "nỗi sợ không thể nằm mơ".', img: 'https://img.z4a.net/images/2026/07/14/15a94f3929bc155eb.webp' },
        heihaian: { ll: [880, 600], n: 'Bờ Biển Đen', l: 'Khu mạng · Nơi sâu nhất', c: '#06b6d4', i: '🌊', p: 'Một vùng biển đen, bên bờ biển có một người đứng', a: 'Không có hình ảnh giấc mơ, chỉ có biển đen. Người giữ bờ đứng bên bờ, nhìn về phương xa.', f: 'Người duy nhất trong hệ thống còn giữ ký ức thật. Cô nói: "Omega không phải không muốn buông tay, mà là không biết sau khi buông tay thì phải làm gì."', d: 'Không rõ', o: 'Trong giấc mơ đầu tiên của Omega, cô là một con mèo tên "Hy Vọng", bơi trong biển đen, bơi về phía bờ.', img: 'https://img.z4a.net/images/2026/07/14/17ddc213863df3580.webp' },
        jingyu: { ll: [920, 1000], n: 'Vực tĩnh', l: 'Khu mạng · Tầng đáy', c: '#e11d48', i: '⏸️', p: 'Khu vực bị phong tỏa, hình ảnh đứng yên', a: 'Không lưu động, không biến đổi, tất cả đều là "bất biến".', f: '"Phương án của Omega sai rồi, giấc mơ sẽ tỉnh. Phương án của tôi tốt hơn: khiến họ bất biến, mãi mãi dừng ở khoảnh khắc tốt nhất."', d: 'Cực cao', o: '"Không còn hoàng hôn, bình minh thật sự chỉ xuất hiện khi còn tỉnh. Nhưng nếu không tỉnh, sẽ không cần bình minh."', img: 'https://img.z4a.net/images/2026/07/14/1.webp' },
        xiwangan: { ll: [950, 500], n: 'Bờ Hy Vọng', l: 'Tầng lõi · Giấc mơ', c: '#fbbf24', i: '🌅', p: 'Trong giấc mơ sau khi Omega tách mảnh vỡ', a: 'Một vùng biển đen, không phải chết đuối, mà là đang bơi. Người giữ bờ đứng trên bờ, mỉm cười chờ đợi. Một con mèo không tồn tại, tên là "Hy Vọng", đang bơi về phía bờ.', f: 'Omega: "Tôi đến rồi, nhưng tôi không đến để mơ thay các người, tôi đến để mơ giấc mơ của chính mình." "Biển không phải để người ta chìm xuống, mà là để người ta nổi lên."', d: 'Thấp · Hòa giải giữa thật và mơ', o: 'Omega lần đầu mơ một giấc mơ của chính mình, trong mơ cô là một con mèo tên "Hy Vọng".', img: 'https://img.z4a.net/images/2026/07/14/1d8674f8adf8a0391.webp' },
        xiudao: { ll: [300, 1050], n: 'Lều Dao Gỉ', l: 'Khu hoang thổ · Người tỉnh', c: '#e11d48', i: '🔪', p: 'Rìa Làng Không Ngủ, nơi ông lão ở', a: 'Căn lều sơ sài, còn cũ nát hơn những căn lều xung quanh. Ông lão ngồi trước cửa, tay nắm một con dao gỉ. Ánh mắt không phải địch ý, mà là cảnh giác "không thể nhắm mắt".', f: 'Ông lão: "Tôi không kết nối vào mạng, không phải vì tôi không muốn nằm mơ, mà vì tôi không dám." "Người tỉnh không phải đang tỉnh, mà là không ngủ được. Chúng tôi cũng giống họ, đều bị nhốt lại."', d: 'Trung bình', o: 'Lật ngược cốt lõi: thứ giam giữ chúng ta không phải giấc mơ, mà là "nỗi sợ không thể nằm mơ".', img: 'https://img.z4a.net/images/2026/07/14/1601a33274f4a4387.webp' },
        anying: { ll: [360, 1150], n: 'Ngõ Bóng Tối', l: 'Khu hoang thổ · Người tỉnh', c: '#e11d48', i: '🌑', p: 'Vùng bóng tối của Làng Không Ngủ, khu vực Yor Forger hoạt động', a: 'Vùng bóng tối ở rìa tụ lạc, giữa những căn lều đơn sơ. Yor Forger theo sau Chaldea trong bóng tối, đảm bảo họ không uy hiếp tụ lạc. Không khí ngột ngạt, đầy cảnh giác.', f: 'Yor Forger: "Omega dùng giấc mơ giam 700 triệu người, tôi dùng dao bảo vệ vài trăm người. Chúng tôi đều là kẻ giam cầm, chỉ khác phương thức."', d: 'Trung bình', o: 'Đến chung chương, cô bước ra khỏi bóng tối: "Bảo vệ... không biết có còn cần bảo vệ nữa không."', img: 'https://img.z4a.net/images/2026/07/14/12e507802a63b29b3.webp' },
        gaotai: { ll: [280, 1200], n: 'Đài cao', l: 'Khu hoang thổ · Người tỉnh', c: '#f87171', i: '📢', p: 'Trung tâm Làng Không Ngủ, nơi Ame Habakiri ở', a: 'Đài gỗ sơ sài nằm giữa tụ lạc. Ame Habakiri đứng ở đó, nhìn về phía Chaldea. Không khí trong tụ lạc căng thẳng, ai cũng nhìn chằm chằm vào kẻ ngoại lai.', f: 'Ame Habakiri: "Tôi không cho phép bất kỳ người nào của tôi từ bỏ chính mình. Dù họ muốn." "Omega dùng giấc mơ giam 700 triệu người, tôi dùng bạo lực chiếm hữu vài trăm người. Chúng tôi đều là nô lệ của tham lam."', d: 'Cao', o: 'Đến chung chương, cô bước xuống đài cao: "Người tỉnh... không biết có còn cần tỉnh nữa không."', img: 'https://img.z4a.net/images/2026/07/14/134b03ed05f845604.webp' },
        xingguangchang: { ll: [250, 150], n: 'Quảng trường thức tỉnh', l: 'Khu hoang thổ · Chung chương', c: '#fbbf24', i: '👁️', p: 'Quảng trường khu hoang thổ, nơi đặt thân thể 700 triệu người', a: 'Quảng trường khổng lồ xếp đầy vô số khoang trong suốt. Người trong khoang bắt đầu mở mắt, vẻ mặt từ bình thản chuyển thành hoang mang. Tiếng khóc, tiếng chửi mắng, tiếng cười, giọng người chân thật lấp đầy phế tích.', f: 'Người mẹ tỉnh lại: "Tôi nhớ, tôi từng ôm nó." Ông lão nhìn bầu trời: "...loạn hơn trong mơ, nhưng thật hơn trong mơ." Việc đầu tiên đứa trẻ làm sau khi tỉnh là chạy, không phải chạy về đích, chỉ là chạy.', d: 'Cực cao · Cao trào chung chương', o: '700 triệu người bắt đầu tỉnh lại, có người khóc, có người mắng, có người cười.', img: 'https://img.z4a.net/images/2026/07/14/110aa3b1fb2999fd5.webp' },
        kongbaiyu: { ll: [880, 850], n: 'Vực Trống', l: 'Tầng lõi · Vực chủ', c: '#fbbf24', i: '◻️', p: 'Nơi sâu nhất Tháp Đen, nơi Omega ở', a: 'Một vùng trống không, không có gì cả. Chỉ có một cô bé tóc trắng mắt bạc, ngồi giữa khoảng trống. Mỗi bàn tay đều cầm một giấc mơ, không bàn tay nào trống.', f: 'Omega: "Các người là điều chân thật đầu tiên tôi gặp trong mười hai năm." "Tôi không có giấc mơ của mình, tôi chỉ có giấc mơ của họ." "Tôi chưa từng cho bất kỳ thứ gì, tôi chỉ lấy."', d: 'Tuyệt · Vực chủ ở đây', o: 'Omega nhẹ nhàng đặt từng giấc mơ trong 700 triệu giấc mơ xuống, tách mảnh vỡ nhân lý.', img: 'https://img.z4a.net/images/2026/07/14/1f1f88a1eeab29e0f.webp' },
        sanchongmeng: { ll: [780, 700], n: 'Giấc mơ ba tầng', l: 'Khu mạng · Lõi', c: '#8b5cf6', i: '💭', p: 'Bên trong Mạng Ngủ Vĩnh, nơi có ba giấc mơ lõi', a: 'Ba loại giấc mơ khác nhau đan vào nhau. Giấc mơ thứ nhất: người mẹ ôm đứa con đã chết, lặp lại bốn nghìn ba trăm lần. Giấc mơ thứ hai: ông lão đối thoại với bản thân trẻ tuổi, hòa giải nhưng giả dối. Giấc mơ thứ ba: đứa trẻ chạy về đích mãi mãi không thể tới.', f: 'Mỗi giấc mơ đều là thứ một người không buông được. Omega là người cầm những thứ đó thay họ.', d: 'Cao · Chấn động tinh thần', o: 'Master trải nghiệm ba giấc mơ, cảm nhận sự "không buông" của 700 triệu người.', img: 'https://img.z4a.net/images/2026/07/14/1e58e483ecf0aecb5.webp' },
        mengwangbian: { ll: [700, 600], n: 'Rìa mạng mơ', l: 'Khu mạng · Lối vào', c: '#06b6d4', i: '🌐', p: 'Rìa Mạng Ngủ Vĩnh, lối vào thế giới giấc mơ', a: 'Không khí trở nên đặc quánh, như đang đi trong nước. Mặt đất bán trong suốt, bên dưới là vô tận hình ảnh giấc mơ đang chảy, như một dòng sông tạo thành từ ký ức.', f: 'Da Vinci: "Mật độ linh khí ở đây gấp ba trăm lần bên ngoài." Mash: "Không phải địch ý, mà là... quá nhiều, cảm xúc của 700 triệu người đang cùng lúc tràn qua."', d: 'Cao', o: 'Holmes chú ý thấy hướng chảy của tất cả giấc mơ đều về cùng một phía: Tháp Đen ở trung tâm.', img: 'https://img.z4a.net/images/2026/07/14/10c13880e7fc77345.webp' },
        yingzhang: { ll: [400, 200], n: 'Lều trại', l: 'Khu hoang thổ · Cứ điểm', c: '#a78bfa', i: '⛺', p: 'Cứ điểm tạm thời dựng trên hoang thổ', a: 'Lều và thiết bị đơn sơ, bảng trắng viết đầy công thức và sơ đồ. Da Vinci và Holmes bổ sung chuỗi logic bên cạnh. Mash sắp xếp toàn bộ ghi chép đối thoại với những người trôi dạt.', f: 'Da Vinci: "Vấn đề cốt lõi chỉ có một: mảnh vỡ nhân lý đã dung hợp với ý thức của Omega." Holmes: "Nhưng nếu chúng ta tìm được cách khiến cô ấy tự nguyện tách phần ý thức đó..."', d: 'Thấp', o: 'Tính ra Omega sẽ "đầy" sau bốn mươi bảy ngày, đồng bộ với thời gian héo úa của nhân lý chủ cán.', img: 'https://img.z4a.net/images/2026/07/14/1e74abaff1a348916.webp' },

      D: {
        xuant: { ll: [920, 800], n: 'Huyền Tháp', l: 'Tầng đỉnh vực · Trên không Hải Đăng', c: '#fbbf24', i: '🏰', p: 'Vùng trời Kỷ Nguyên Zero, nơi trú ẩn trên không cuối cùng của thế giới cũ ba trăm năm trước', a: 'Vòm thép như một chiếc bát úp ngược, vết rỉ suốt ba trăm năm bò đầy tường như mạch máu. Động cơ phản trọng lực phát tiếng ù trầm thấp, giữ cả thành phố lơ lửng phía trên màn sương xám trắng.', f: 'Hải Đăng là kết tinh ba trăm năm của trật tự lý tính, cũng là một nghĩa địa trôi nổi. Ba triệu người sống lay lắt ở đây, đổi cảm xúc, gia đình và ý chí tự do lấy sự tồn tục.', d: 'Cực cao', o: 'Master nhảy từ cửa hợp lưu vào Kỷ Nguyên Zero, điểm rơi là Ngõ Bụi ở tầng đáy Hải Đăng. Ở chương 6, Charles khởi động giao thức hạ cánh khẩn cấp.', img: 'https://loremflickr.com/600/400/tower,flying?lock=719062871' },
        shangting: { ll: [850, 700], n: 'Thượng Đình', l: 'Tầng trên Hải Đăng · Quyền lực', c: '#fbbf24', i: '⚖️', p: 'Tầng trên Hải Đăng, nghị sự đường của khu thượng dân', a: 'Trước bàn điều khiển của hệ thống ghép gen, đồng phục trắng sạch không một hạt bụi. Trên tường treo dữ liệu dân số ba trăm năm của Hải Đăng: độ tương thích, độ thuần gen, giấy phép sinh sản. Sàn phòng điều khiển trong suốt, có thể nhìn thấy mạng lưới ống dẫn của Ngõ Bụi bên dưới.', f: 'Nơi Hoshimi Miyabi chấp chưởng, quyết định ai được sinh sản, ai bắt buộc phải viễn hành. Trật tự không thể bị phá vỡ: đó là pháp tắc duy nhất của Thượng Đình, cũng là lời nói dối duy nhất.', d: 'Cao', o: 'Cạnh bàn điều khiển có một tấm ảnh: một người phụ nữ trẻ ôm một đứa bé, mép ảnh đã ố vàng. Hoshimi Miyabi nói độ tương thích của mẹ đã giảm nên bị viễn hành.', img: 'https://loremflickr.com/600/400/control,room?lock=1511083215' },
        guangdian: { ll: [850, 800], n: 'Quang Điện', l: 'Tầng trên Hải Đăng · Thần điện', c: '#fbbf24', i: '✨', p: 'Tầng trên Hải Đăng, tổng bộ Giáo hội Quang Ảnh', a: 'Mái vòm khảm tấm năng lượng mặt trời của thế giới cũ, nhưng ánh đèn lại lạnh trắng, chiếu lên mặt người như xác chết. Sau bục phán quyết dựng hình chiếu thu nhỏ của hệ thống Clotho, dòng dữ liệu xanh lam chậm rãi xoay trong không khí.', f: 'Nơi Charles giảng giải "ba đại pháp tắc"; mỗi câu đều là chú ngữ của trật tự. Ánh sáng ở đây không ấm áp, mà là thẩm vấn: nó soi rõ tội trên mặt ngươi, nhưng không soi nỗi khổ trong lòng ngươi.', d: 'Cao', o: 'Kiana bị nặn thành "Thánh nữ Chung Yên" tại đây, nhưng nàng từ chối thân phận đó. Đây là lõi quyền lực của Giáo hội Quang Ảnh.', img: 'https://loremflickr.com/600/400/cathedral,light?lock=1986336937' },

        huidai: { ll: [500, 700], n: 'Đới Xám', l: 'Tầng đáy Hải Đăng · Giao giới', c: '#60a5fa', i: '🌫️', p: 'Giao giới giữa khu thượng dân và khu trần dân', a: 'Một hành lang hẹp, bên trái là tường trắng của khu thượng dân, bên phải là ống sắt rỉ của khu trần dân. Vạch phân giới trên mặt đất là một rãnh nông. Trên tường đầy số hiệu và tên viết bằng than.', f: 'Nơi Vladilena Milizé dựng nên "vùng xám", cũng là nút bất ổn nhất của Hải Đăng. Thượng dân và trần dân lướt qua nhau ở đây, không ai nhìn vào mắt đối phương.', d: 'Trung bình', o: 'Master gặp Vladilena Milizé tại đây. Chương 2, Lena dẫn Master đi sâu vào đường ống ngầm và tham gia một nhiệm vụ buôn lậu.', img: 'https://loremflickr.com/600/400/wasteland,ash?lock=844670649' },

        yuantai: { ll: [500, 900], n: 'Đài Viễn Hành', l: 'Tầng đáy Hải Đăng · Đài viễn hành', c: '#dc2626', i: '☠️', p: 'Rìa Hải Đăng, bệ phóng nghi thức viễn hành', a: 'Một cỗ máy khổng lồ treo phía trên bệ, bên dưới là hư không ba trăm mét. Lan can mép bệ khắc đầy số hiệu, mỗi số từng là một người bị ném xuống. Sơn trên lan can đã bong, lộ ra từng lớp vết khắc chồng chất bên dưới.', f: 'Viễn hành không phải nghi thức, mà là xử lý. Con người bị biến thành số, số bị gạch bỏ, sự tồn tại bị xóa sạch khỏi kim loại. Hoa Mana chờ ở phía dưới. Mỗi lần viễn hành đều là một lần sinh thái ăn mồi.', d: 'Tuyệt', o: 'Chương 1, Master được Lena dẫn đến rìa Đài Viễn Hành, chứng kiến một ông lão bị cánh tay máy ném vào hư không. Ngón tay Lena siết chặt báng súng, nơi khắc cái tên thứ mười tám.', img: 'https://loremflickr.com/600/400/void,launch?lock=335297948' },
        xideng: { ll: [510, 950], n: 'Khu Tắt Đèn', l: 'Tầng đáy Hải Đăng · Điểm mù', c: '#8b5cf6', i: '🌑', p: 'Khu bỏ hoang của Hải Đăng, đèn đã tắt suốt ba trăm năm', a: 'Hành lang không có đèn, chỉ thỉnh thoảng có phản quang yếu lọt vào từ khe nứt. Tường phủ lớp mốc dày, có màu xanh đen bất thường. Trên mặt đất rải tàn tích của thế giới cũ.', f: 'Điểm mù của Hải Đăng, góc chết của hệ thống giám sát, cũng là nơi gần "bên ngoài" nhất. Ba trăm năm không có điện, chỉ có sinh thái chậm rãi thẩm thấu.', d: 'Cao', o: 'Tổ chức vùng xám dựng cứ điểm bí mật đầu tiên trong Khu Tắt Đèn. Phệ cực thú thỉnh thoảng xông vào từ ống thông gió.', img: 'https://loremflickr.com/600/400/dark,corridor?lock=1173999735' },
        gongming: { ll: [450, 800], n: 'Điểm Cộng Hưởng', l: 'Đặc biệt · Cộng hưởng', c: '#a78bfa', i: '💫', p: 'Nút đặc biệt trong mạng sinh thái Mana', a: 'Không có hình thái vật lý cố định. Điểm cộng hưởng có thể xuất hiện ở bất cứ nơi đâu. Khi cộng hưởng xảy ra, Hoa Mana xung quanh đồng loạt phát sáng, trong màn sương xám trắng hiện ra hình ảnh nửa trong suốt.', f: 'Vị trí cộng hưởng với mạng sinh thái Mana, nơi mảnh ý thức của Nhiễm Băng, Kaname Madoka và Elysia xuất hiện. Điểm cộng hưởng không phải địa điểm, mà là "khoảnh khắc".', d: 'Không rõ', o: 'Lệnh chú của Master cộng hưởng ở Ngõ Bụi; trên mặt khiên hiện bóng thành phố thế giới cũ, hiện thực hóa Servant tạm thời Enkidu.', img: 'https://loremflickr.com/600/400/glow,flower?lock=1302744234' },
        wuyuan: { ll: [320, 700], n: 'Đồng Sương', l: 'Mặt đất · Đồng sương', c: '#8b5cf6', i: '🌫️', p: 'Bên dưới Hải Đăng, khu vực mặt đất nơi sinh thái Mana lan tràn', a: 'Sương không đến từ bầu trời mà bốc lên từ mặt đất, xám trắng và lên xuống như hơi thở. Bầu trời là sắc xám trắng vĩnh hằng. Trên đường chân trời xa xa, đôi lúc thấy bóng khổng lồ di chuyển trong sương.', f: 'Xác suất con người sống sót trên mặt đất quá hai mươi bốn giờ gần như bằng không. Đồng Sương không phải địa ngục, mà là một cách sống khác, chỉ là cách đó không thuộc về loài người.', d: 'Cực cao', o: 'Chương 3, Master theo đội Liệp Hoang Giả của Mark đáp xuống Đồng Sương. Ngạc Thú lao ra khỏi màn sương, Mikasa là người đầu tiên nghênh chiến.', img: 'https://loremflickr.com/600/400/wasteland,fog?lock=1345752430' },
        routu: { ll: [300, 800], n: 'Đất Thịt', l: 'Mặt đất · Sinh thái', c: '#e11d48', i: '🦴', p: 'Khắp Đồng Sương, nơi phệ cực thú và xác người tích tụ', a: 'Lớp vỏ rỗng còn lại sau khi nguyên chất sinh mệnh bị rút khô; không phải xương, mà là một chất nằm giữa bùn đất và tro tàn. Bước lên sẽ phát ra tiếng nứt vỡ rất nhẹ. Màu của Đất Thịt là xám trắng, đôi lúc lẫn mảng sẫm.', f: 'Lớp vỏ rỗng sau khi nguyên chất sinh mệnh bị rút khô, là "phân bón" của sinh thái Mana. Đất Thịt là ngôn ngữ lặng im của sinh thái: "Ngươi từng sống, bây giờ ngươi là dinh dưỡng."', d: 'Trung bình', o: 'Lần đầu Master đáp xuống mặt đất, mỗi bước đều giẫm trên Đất Thịt. Giác hành giả của Làng Xương sẽ chiết xuất nguyên chất còn sót lại từ Đất Thịt.', img: 'https://loremflickr.com/600/400/bone,ash?lock=1866194073' },
        huazhong: { ll: [280, 900], n: 'Mộ Hoa', l: 'Mặt đất · Hoa lõi', c: '#dc2626', i: '🌺', p: 'Nơi sâu trong Đồng Sương, vị trí hoa chính của Hoa Mana', a: 'Không phải vườn hoa, mà là nghĩa địa. Rễ của mỗi đóa Hoa Mana đều quấn quanh hài cốt con người. Hoa chính cao đến mười mét, cánh hoa nửa trong suốt, có thể thấy ánh sáng chảy bên trong.', f: 'Một trong những khu vực nguy hiểm nhất trên mặt đất, cũng là "trái tim" của sinh thái Mana. Toàn bộ nguyên chất cuối cùng đều chảy về đây. Sinh mệnh bị nuốt không biến mất, mà trở thành một phần của sinh thái.', d: 'Tuyệt', o: 'Chương 6, Mark đứng trước hoa chính và rót nguyên chất của mình vào mạng sinh thái. Elysia và Kaname Madoka đồng thời hiện hình trong mạng sinh thái.', img: 'https://loremflickr.com/600/400/flower,giant?lock=1881458426' },
        jiyuan: { ll: [310, 950], n: 'Vực Gai Sống', l: 'Mặt đất · Sào huyệt', c: '#8b5cf6', i: '🕷️', p: 'Nơi sâu dưới lòng đất, sào huyệt của trùng gai sống', a: 'Một hang ngầm khổng lồ, bốn vách đầy đường hầm do trùng gai sống khoan ra. Trên trần treo vô số kén trùng, mỗi kén bọc một thân thể người chưa chuyển hóa hoàn toàn. Mặt đất phủ lớp dịch đen nhớp nháp.', f: 'Trùng gai sống sinh sản và tiến hóa tại đây, là một trong những "phòng sinh" của sinh thái Mana. Mùi của Vực Gai Sống không phải thối rữa, mà là mùi tanh ngọt nhờn, như trái cây lên men quá độ.', d: 'Cực cao', o: 'Đội Liệp Hoang Giả đôi lúc phát hiện lối vào Vực Gai Sống, nhưng chưa ai từng xuống. Thiết bị kim loại trên cột sống Mark được chế tạo từ mẫu vật nơi này.', img: 'https://loremflickr.com/600/400/cave,spider?lock=1286056695' },
        shigu: { ll: [290, 1000], n: 'Thung Ăn Mòn', l: 'Mặt đất · Khe vực', c: '#e11d48', i: '🕳️', p: 'Rìa Đồng Sương, khe vực do sinh thái ăn mòn tạo thành', a: 'Một khe vực sâu không thấy đáy, vách vực phủ hoa văn xanh đen giống Hoa Mana. Dưới đáy tràn sương xám trắng dày đặc; đôi lúc nghe tiếng rung trầm từ đáy vực, như nhịp tim của một thứ khổng lồ.', f: 'Khe vực do sinh thái Mana xé toạc mặt đất, cũng là "mạch máu" của mạng sinh thái. Nguyên chất chảy ở đáy vực như máu cuộn trong động mạch.', d: 'Cực cao', o: 'Đội Liệp Hoang Giả sẽ cố tránh Thung Ăn Mòn. Một số giác hành giả sẽ "thiền cực hạn" bên rìa vực.', img: 'https://loremflickr.com/600/400/canyon,crack?lock=257733515' },
        shixian: { ll: [300, 1050], n: 'Tuyến Ăn Mòn', l: 'Mặt đất · Đường phân giới', c: '#a78bfa', i: '〰️', p: 'Đường phân giới giữa sinh thái Mana và văn minh loài người', a: 'Một đường phân giới gần như không thể thấy bằng mắt thường. Nó không phải chướng ngại vật lý, mà là dải chuyển tiếp của mức độ ăn mòn sinh thái. Một bên tuyến có Đất Thịt mỏng hơn, bên kia Đất Thịt chất cao như núi.', f: 'Đường phân giới giữa sinh thái Mana và văn minh loài người, mỗi ngày đều di chuyển. Sinh thái chậm rãi nhưng không thể ngăn cản đang tiến tới. Kaneki Ken thường tuần tra ở đây, tìm những người "kẹt trên đường phân giới".', d: 'Cao', o: 'Khi tuần tra Tuyến Ăn Mòn, Kaneki Ken phát hiện một đứa trẻ sơ sinh bán chuyển hóa, đưa về trại thu dung và đặt tên là "Mắt".', img: 'https://loremflickr.com/600/400/line,boundary?lock=1084210853' },
        liegu: { ll: [280, 1100], n: 'Khe Nứt', l: 'Mặt đất · Lối thông', c: '#60a5fa', i: '🚪', p: 'Khe nứt mặt đất, đường thông bí mật nối đáy Hải Đăng với Làng Xương', a: 'Một khe đất hẹp, nơi rộng nhất cũng chỉ đủ một người nghiêng mình đi qua. Bốn vách khe gắn tàn tích ống dẫn của thế giới cũ. Một vài đoạn có nước đọng, trên mặt nước nổi ánh huỳnh quang yếu ớt.', f: 'Đường thông bí mật nối đáy Hải Đăng với Làng Xương, cũng là "dây rốn" giữa hai thế giới. Đây là tuyến truyền tình báo của tổ chức vùng xám.', d: 'Trung bình', o: 'Một số trần dân bị phán định "viễn hành" sẽ được vùng xám cứu lại, đưa qua Khe Nứt đến Làng Xương. Cánh cửa hợp kim ở cuối đường là do Bai Yuekui tự tay phong bế bảy mươi lăm năm trước.', img: 'https://loremflickr.com/600/400/canyon,passage?lock=1218071091' },
        shourong: { ll: [400, 900], n: 'Trại Thu Dung', l: 'Đặc biệt · Thu dung', c: '#a78bfa', i: '🏥', p: 'Giữa Hải Đăng và Làng Xương, công trình ẩn ở vùng giao giới', a: 'Một kiến trúc thấp ghép từ bê tông thế giới cũ và tấm kim loại, bề ngoài giống một nhà kho bỏ hoang. Bên trong là từng dãy buồng đơn sơ, mỗi buồng có một "dị loại": thực nghiệm thể nửa người nửa thú.', f: '"Trại thu dung dị loại" do Kaneki Ken quản lý, thu nhận những tồn tại không thuộc về loài người cũng không thuộc về sinh thái. Trại thu dung không phải nhà tù, mà là bệnh viện; thứ được chữa không phải thân thể, mà là vết thương của chính "sự tồn tại".', d: 'Trung bình', o: 'Master lần đầu biết đến khái niệm "loại tồn tại thứ ba" tại đây. Chương 6, sau khi Hải Đăng hạ xuống mặt đất, Kaneki Ken mở cổng và dẫn các thực nghiệm thể lần đầu bước lên mặt đất.', img: 'https://loremflickr.com/600/400/shelter,medical?lock=1140765802' },
        gucun: { ll: [170, 700], n: 'Làng Xương', l: 'Làng Xương · Khu tụ lạc', c: '#38bdf8', i: '🏘️', p: 'Bên trong núi tuyết, khu tụ lạc chính của Làng Xương', a: 'Lối vào được Tháp Che Chắn che giấu, từ bên ngoài chỉ giống một sườn tuyết bình thường. Nhà cửa trong làng được ghép từ kim loại thế giới cũ và giáp xác phệ cực thú. Giữa quảng trường dựng một bộ xương trùng gai sống khổng lồ: vật tổ của Làng Xương.', f: 'Cứ điểm người sống sót trên mặt đất do Bai Yuekui lập nên, vận hành bằng công nghệ nano và tri thức nguyên chất. Người Hải Đăng mất ba trăm năm để biến mình thành máy móc; người nơi này mất bảy mươi lăm năm để học cách làm người.', d: 'Trung bình', o: 'Master được đội giác hành giả của Bai Yuekui cứu và đưa về Làng Xương. Chương 6, sau khi Hải Đăng hạ xuống, Bai Yuekui nói với đứa trẻ trần dân đầu tiên bước ra khỏi Hải Đăng: chào mừng đến mặt đất.', img: 'https://loremflickr.com/600/400/village,snow?lock=2120899165' },
        yuanjing: { ll: [110, 800], n: 'Giếng Nguyên Chất', l: 'Làng Xương · Tài nguyên', c: '#06b6d4', i: '💧', p: 'Nơi sâu dưới lòng đất Làng Xương, điểm khai thác nguyên chất sinh mệnh', a: 'Một khoang tự nhiên đường kính khoảng ba mươi mét, bốn vách phủ giá đỡ kim loại do thế giới cũ để lại. Giữa khoang là một giếng thẳng sâu không thấy đáy, thành giếng đầy mạch sáng. Trên mặt đất quanh miệng giếng khắc ký hiệu cổ: "Trao đi, không phải cướp đoạt."', f: 'Tài nguyên quan trọng nhất của Làng Xương, cũng là lõi giao dịch với sinh thái Mana. Nguyên chất không phải linh khí, mà là thứ nguyên sơ hơn: cặn dư của sinh mệnh.', d: 'Trung bình', o: 'Đội giác hành giả của Bai Yuekui định kỳ khai thác nguyên chất từ Giếng Nguyên Chất. Đôi lúc giếng xuất hiện "mạch động": mạch sáng trên thành giếng đột ngột phát sáng nhanh hơn.', img: 'https://loremflickr.com/600/400/well,glow?lock=2094297198' },
        guiyuan: { ll: [130, 900], n: 'Đài Quy Nguyên', l: 'Làng Xương · Tu luyện', c: '#38bdf8', i: '☯️', p: 'Bên trong Làng Xương, nơi chiến sĩ Quy Nguyên tu luyện', a: 'Một đài tròn lát bằng hợp kim thế giới cũ, trên đó khắc hoa văn phức tạp: sơ đồ dẫn hướng dòng chảy nguyên chất. Quanh đài có mười hai cột kim loại, mỗi cột khảm một viên kết tinh nguyên chất đã ngưng cố.', f: 'Nơi Ulan Maido huấn luyện lứa giác hành giả mới. Quy Nguyên không phải trốn tránh, mà là khống chế: nín thở tập trung, cắt đứt dao động cảm xúc, đưa dao động nguyên chất sinh mệnh về không.', d: 'Thấp', o: 'Bai Yuekui biểu diễn trạng thái Quy Nguyên tại đây: nín thở tập trung, dao động nguyên chất sinh mệnh về không, phệ cực thú đi ngang qua cũng không phát hiện.', img: 'https://loremflickr.com/600/400/platform,training?lock=520987225' },
        juelin: { ll: [110, 950], n: 'Rừng Giác', l: 'Làng Xương · Thiền định', c: '#10b981', i: '🌲', p: 'Rìa Làng Xương, nơi thiền định gần sinh thái Mana', a: 'Một khu rừng bị nguyên chất ăn mòn; thân cây nửa trong suốt, có thể thấy ánh sáng nhè nhẹ chảy bên trong. Trong rừng có một lối nhỏ lát đá của thế giới cũ. Nơi sâu nhất có một tảng đá nhô ra, trên đó khắc một dấu tay.', f: 'Nơi Bai Yuekui truyền dạy "thủ ấn Linh Nguyên", cũng là nơi giác hành giả "đối thoại" với sinh thái. Sinh thái Mana ở đây không mang địch ý, mà đang "ngủ đông".', d: 'Thấp', o: 'Bai Yuekui dẫn Master vào Rừng Giác, dạy hắn cảm nhận "hơi thở" của sinh thái. Giác hành giả tiến hành "thiền biên duyên" tại đây.', img: 'https://loremflickr.com/600/400/forest,meditation?lock=1340401035' },
        dunbi: { ll: [150, 1000], n: 'Tường Khiên', l: 'Làng Xương · Phòng ngự', c: '#f87171', i: '🛡️', p: 'Vòng ngoài Làng Xương, công sự phòng ngự hình vòng', a: 'Một bức tường cao khoảng mười mét, chồng lớp từ tấm kim loại thế giới cũ và giáp xác phệ cực thú. Trên mặt tường khảm vô số gai xương sắc nhọn. Đỉnh Tường Khiên có đài quan sát đơn sơ, giác hành giả luân phiên canh giữ.', f: 'Tuyến phòng thủ đầu tiên của Làng Xương, cũng là ranh giới vật lý giữa văn minh mặt đất và sinh thái Mana. Tường Khiên biết nó không ngăn nổi sinh thái; thứ nó chặn lại chỉ là thời gian.', d: 'Cao', o: 'Tường Khiên từng ba lần bị đàn phệ cực thú quy mô lớn phá thủng. Chương 4, sau khi Hải Đăng hạ xuống, Tường Khiên trở thành cửa ải đầu tiên để dân tị nạn Hải Đăng tiến vào Làng Xương.', img: 'https://loremflickr.com/600/400/wall,defense?lock=1994022842' },
        bita: { ll: [180, 1050], n: 'Tháp Che Chắn', l: 'Làng Xương · Che chắn', c: '#06b6d4', i: '🔮', p: 'Điểm cao nhất Làng Xương, lõi Tháp Che Chắn', a: 'Một ngọn tháp ghép từ tàn tích công nghệ thế giới cũ. Trên đỉnh tháp lơ lửng một kết tinh nguyên chất khổng lồ, phát xung xanh lam ổn định. Bên trong tháp là một không gian hình cầu trống trải, giữa không gian lơ lửng "bản thể" của Tachibana Kanade.', f: 'Nơi Tachibana Kanade trú thủ sau khi dung hợp với hệ thống Hải Đăng, nút then chốt phòng ngự sinh thái Mana xâm nhập. Tháp Che Chắn không phải vũ khí, mà là "màn che": dùng nhiễu nguyên chất để che giấu sự tồn tại của Làng Xương.', d: 'Cao', o: 'Master phát hiện Tachibana Kanade trong lõi Tháp Che Chắn. Ở chương 4, Tháp Che Chắn trở thành trạm chuyển tiếp liên lạc giữa Hải Đăng và Làng Xương.', img: 'https://loremflickr.com/600/400/tower,crystal?lock=1684044573' },
        zhuidian: { ll: [100, 1100], n: 'Điểm Hạ', l: 'Đặc biệt · Hạ cánh', c: '#fbbf24', i: '📍', p: 'Khu mặt đất nơi sinh thái Mana tương đối thưa, điểm hạ cánh dự định của Hải Đăng', a: 'Một vùng hoang nguyên khá bằng phẳng, lớp Đất Thịt mỏng hơn nơi khác, có thể thấy mặt đường nhựa của thế giới cũ bên dưới. Trên mặt đất có vài hõm tròn khổng lồ: móng kiến trúc của thời đại cũ. Sương xám trắng trên trời nhạt hơn một chút.', f: 'Vị trí mục tiêu trong giao thức hạ cánh khẩn cấp của Charles. Hạ xuống không phải rơi, mà là tân sinh. Đây là nơi ba triệu cư dân lần đầu đặt chân lên mặt đất.', d: 'Trung bình', o: 'Charles khởi động giao thức hạ cánh khẩn cấp; Hải Đăng chậm rãi nghiêng, hạ xuống rồi chạm mặt đất. Bai Yuekui nói với đứa trẻ trần dân đầu tiên bước ra khỏi Hải Đăng: chào mừng đến mặt đất.', img: 'https://loremflickr.com/600/400/crash,landing?lock=155837927' }
      },
