    const ASSET_TO_DISPLAY = Object.freeze(Object.entries(PATH_ALIAS_TO_ASSET).reduce((o, [display, asset]) => { if (!o[asset]) o[asset] = display; return o; }, {}));
    function _cleanAssetToken(v) {
      return safeDecode(String(v || ''))
        .replace(/\.webp$/i, '')
        .replace(/\{\{\s*roll\s*:\s*d\d+\s*\}\}/ig, '')
        .replace(/^\/+|\/+$/g, '')
        .trim()
        .normalize('NFC');
    }
    function _aliasKey(v) { return _cleanAssetToken(v).replace(/_/g, ' ').replace(/\s+/g, ' '); }
    function _assetAlias(v) {
      const key = _aliasKey(v);
      if (PATH_ALIAS_TO_ASSET[key]) return PATH_ALIAS_TO_ASSET[key];
      const compact = key.replace(/\s/g, '').toLowerCase();
      const hit = Object.keys(PATH_ALIAS_TO_ASSET).find(k => k.replace(/\s/g, '').toLowerCase() === compact);
      return hit ? PATH_ALIAS_TO_ASSET[hit] : _cleanAssetToken(v);
    }
    function _displayAssetName(v) {
      const base = _cleanAssetToken(v).replace(/\d+$/, '');
      return ASSET_TO_DISPLAY[base] || ASSET_TO_DISPLAY[_cleanAssetToken(v)] || base;
    }
    function _escapeRe(v) { return String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    /* Khớp mờ tên địa điểm: chính xác -> chứa chuỗi -> từng cụm -> LCS -> chọn ngẫu nhiên trong cùng thế giới */
    function _lcsLen(a,b){const na=a.replace(/[·\s]/g,''),nb=b.replace(/[·\s]/g,'');let mx=0;for(let i=0;i<na.length;i++)for(let j=0;j<nb.length;j++){let k=0;while(i+k<na.length&&j+k<nb.length&&na[i+k]===nb[j+k])k++;if(k>mx)mx=k;}return mx;}
    function _pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
    function _findBestMatchPlace(world,keyword){
      const kw=String(keyword||'').trim().replace(/\.\w+$/,'').replace(/\d+$/,'');
      if(!kw||!WORLD_MAP_PLACES[world])return null;
      const bases=WORLD_MAP_PLACES[world].map(p=>({orig:p,base:p.replace(/\d+$/,'')}));
      /* 1. Khớp chính xác */
      const exact=bases.filter(p=>p.base===kw||p.base.replace(/[·\s]/g,'')===kw.replace(/[·\s]/g,''));
      if(exact.length)return {place:_pick(exact).orig,fallback:false,origKeyword:kw};
      /* 2. Khớp chứa chuỗi: gom mọi địa điểm có chứa từ khóa hoặc được từ khóa chứa */
      const contained=bases.filter(p=>p.base.includes(kw)||kw.includes(p.base));
      if(contained.length)return {place:_pick(contained).orig,fallback:false,origKeyword:kw};
      /* 3. Khớp từng cụm */
      const kwWords=kw.split(/[·\/]/).filter(w=>w.length>=1);
      if(kwWords.length>1){
        const wm=bases.filter(p=>kwWords.every(w=>p.base.includes(w)));
        if(wm.length)return {place:_pick(wm).orig,fallback:false,origKeyword:kw};
      }
      /* 4. Khớp mờ bằng LCS: gom các ứng viên đạt ngưỡng */
      const lcsMatches=[];
      let bestScore=0;
      for(const p of bases){
        const score=_lcsLen(p.base,kw);
        const threshold=Math.min(p.base.length,kw.length)*0.4;
        if(score>=threshold){
          if(score>bestScore){bestScore=score;lcsMatches.length=0;lcsMatches.push(p);}
          else if(score===bestScore)lcsMatches.push(p);
        }
      }
      if(lcsMatches.length)return {place:_pick(lcsMatches).orig,fallback:false,origKeyword:kw};
      /* 5. Nếu đều thất bại -> chọn ngẫu nhiên trong cùng thế giới */
      const places=WORLD_MAP_PLACES[world];
      return {place:_pick(places),fallback:true,origKeyword:kw};
    }
    /* Xử lý tag bản đồ trong nội dung và thay bằng khung ảnh.
     * Nhận cả tag Việt `Bản đồ/thế giới/địa_điểm` và key gốc `地图/世界/地点`.
     * Một tag chỉ tạo một ảnh, nếu không khớp thì dùng ảnh dự phòng cùng thế giới. */
    function processMapTags(){
      try{
        const content=document.getElementById('readingContent');
        const worldKeys=[...new Set(Object.keys(WORLD_MAP_PLACES).concat(Object.keys(PATH_ALIAS_TO_ASSET).filter(k=>WORLD_MAP_PLACES[PATH_ALIAS_TO_ASSET[k]])))].sort((a,b)=>b.length-a.length).map(_escapeRe).join('|');
        const mapRe=new RegExp('(?:地图|Bản đồ|Ban do)\\/('+worldKeys+')\\/([^<&\n\r,。！？、；：]+)');
        const _makeContainer=(worldName,bestPlace,tipText,displayWorld,displayPlace)=>{
          const imgSrc=`${BASE_URL}地图/${worldName}/${bestPlace}.webp`;
          const id='map-'+Math.random().toString(36).substr(2,9);
          const mapLabel=`${displayWorld||_displayAssetName(worldName)} · ${displayPlace||_displayAssetName(bestPlace)}`;
          const subTip=tipText?`<div class="image-sub-tip">${tipText}</div>`:'';
          const div=document.createElement('div');
          div.className='image-container map-image-container';
          div.setAttribute('data-map-world',worldName);
          div.setAttribute('data-map-place',bestPlace);
          div.innerHTML=
            `<div class="image-controls">`+
            `<button class="image-toggle-btn" onclick="toggleImage('${id}')">${mapLabel}</button>`+
            `</div>${subTip}`+
            `<div class="image-content expanded" id="${id}">`+
            `<img src="${imgSrc}" alt="${mapLabel}" loading="lazy" onerror="this.onerror=null;this.alt='Ảnh tải thất bại';this.style.opacity='0.3';">`+
            `</div>`;
          return div;
        };
        const _resolve=(w,p)=>{
          const worldAsset=_assetAlias(w);
          if(!WORLD_MAP_PLACES[worldAsset])return null;
          return {worldAsset,result:_findBestMatchPlace(worldAsset,_assetAlias(p))};
        };
        const _build=(w,pr)=>{
          const resolved=_resolve(String(w).trim(),String(pr).trim());
          if(!resolved||!resolved.result)return null;
          const r=resolved.result;
          /* Khớp chính xác thì không hiện nhắc; khớp mờ hoặc dự phòng thì hiện nhắc */
          const placeBase=r.place.replace(/\d+$/,'');
          const origAsset=_assetAlias(r.origKeyword);
          const isExact=placeBase===origAsset||placeBase.replace(/[·\s]/g,'')===origAsset.replace(/[·\s]/g,'');
          const displayPlace=_displayAssetName(r.place);
          const tip=isExact?null:`Không có minh họa địa điểm "${_aliasKey(pr)}", đã thay bằng "${displayPlace}"`;
          return _makeContainer(resolved.worldAsset,r.place,tip,_aliasKey(w),displayPlace);
        };

        /* A. Xử lý tag bản đồ trong thuộc tính src */
        content.querySelectorAll('img').forEach(img=>{
          const src=safeDecode(img.getAttribute('src')||'');
          const m=src.match(mapRe);
          if(m){
            const c=_build(m[1],m[2]);
            if(c) img.replaceWith(c);
          }
        });

        /* B. Xử lý tag bản đồ còn nằm trong text node bằng TreeWalker */
        const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT,null);
        const targets=[];
        let node;
        while((node=walker.nextNode())){
          const text=node.nodeValue;
          if(!text||(!text.includes('地图/')&&!text.includes('Bản đồ/')&&!text.includes('Ban do/'))) continue;
          const m=text.match(mapRe);
          if(m) targets.push({node,match:m,text});
        }
        for(const t of targets){
          const c=_build(t.match[1],t.match[2]);
          if(c){
            const before=t.text.substring(0,t.match.index);
            const after=t.text.substring(t.match.index+t.match[0].length);
            const parent=t.node.parentNode;
            if(before) parent.insertBefore(document.createTextNode(before),t.node);
            parent.insertBefore(c,t.node);
            if(after) parent.insertBefore(document.createTextNode(after),t.node);
            parent.removeChild(t.node);
          }
        }

        /* Dọn các phần tử <img> rỗng không có src */
        content.querySelectorAll('img').forEach(img=>{
          if(!img.getAttribute('src')) img.remove();
        });
      }catch(e){ /* Lỗi xử lý bản đồ không được làm ảnh hưởng luồng CG */ }
    }

    function autoAssignImageNumber(src) {
      const parts=src.split('/');
      const idx=_findCgIndex(parts);
      if(idx<0||idx+2>=parts.length) return {src,tip:null};
      const cat=parts[idx]; let char=_assetAlias(safeDecode(parts[idx+1]));
      parts[idx+1]=encodeURIComponent(char);
      let name=_assetAlias(safeDecode(parts[idx+2]));
      let tip=null;

      /* Tách hậu tố số và lấy tên cảnh cơ sở */
      const fm=name.match(/^(.+?)(\d+)$/);
      const baseName=_assetAlias(fm?fm[1]:name);
      const hasNum=!!fm;
      const charOk=_charExists(char);
      const sceneOk=charOk ? !!_cgLookup(char,baseName) : _sceneExists(safeDecode(cat),baseName);

      /* Bình thường: nhân vật và cảnh đều tồn tại */
      if(charOk && sceneOk){
        if(hasNum) return {src,tip:null};
        const max=_cgLookup(char,baseName);
        parts[idx+2]=encodeURIComponent(baseName+(Math.floor(Math.random()*max)+1)+'.webp');
        return {src:parts.join('/'),tip:null};
      }

      /* Trường hợp 1: không có nhân vật nhưng có cảnh -> đổi nhân vật, giữ cảnh */
      if(!charOk && sceneOk){
        const origChar=char;
        const subChar=_pickSubChar(char);
        parts[idx+1]=encodeURIComponent(subChar);
        const max=_cgLookup(subChar,baseName);
        if(!max) return {src:parts.join('/'),tip:null};
        parts[idx+2]=encodeURIComponent(baseName+(Math.floor(Math.random()*max)+1)+'.webp');
        tip=`Nhân vật "${origChar}" không có minh họa, đã thay bằng "${_displayAssetName(subChar)} · ${_displayAssetName(baseName)}"`;
        return {src:parts.join('/'),tip};
      }

      /* Trường hợp 2: không có cả nhân vật lẫn cảnh -> đổi cả hai */
      if(!charOk && !sceneOk){
        const origChar=char, origType=baseName;
        const subChar=_pickSubChar(char);
        const subType=_pickSubType(cat,baseName);
        parts[idx+1]=encodeURIComponent(subChar);
        const max=_cgLookup(subChar,subType);
        if(!max) return {src:parts.join('/'),tip:`Nhân vật "${origChar}" và cảnh "${origType}" không có minh họa`};
        parts[idx+2]=encodeURIComponent(subType+(Math.floor(Math.random()*max)+1)+'.webp');
        tip=`"${origChar}" không có minh họa, cảnh "${origType}" không tồn tại, đã thay bằng "${_displayAssetName(subChar)} · ${_displayAssetName(subType)}"`;
        return {src:parts.join('/'),tip};
      }

      /* Trường hợp 3: có nhân vật nhưng không có cảnh -> đổi cảnh */
      const origType=baseName;
      const subType=_pickSubType(cat,baseName);
      const max=_cgLookup(char,subType);
      if(!max) return {src:parts.join('/'),tip:null};
      parts[idx+2]=encodeURIComponent(subType+(Math.floor(Math.random()*max)+1)+'.webp');
      tip=`"${_displayAssetName(char)}" không có minh họa "${origType}", đã thay bằng "${_displayAssetName(subType)}"`;
      return {src:parts.join('/'),tip};
    }

    function createInteractiveImageContainer(imgHTML) {
      const id = 'img-' + Math.random().toString(36).substr(2,9);
      const m = imgHTML.match(/src=["']([^"']+)["']/i);
      let tipText=null;
      if (m) {
        const result=autoAssignImageNumber(m[1]);
        imgHTML = imgHTML.replace(m[1], result.src);
        tipText=result.tip;
      }
      const subTip = tipText
        ? `<div class="image-sub-tip">${tipText}</div>`
        : '';
      return `<div class="image-container">
        <div class="image-controls">
          <button class="image-toggle-btn" onclick="toggleImage('${id}')">Xem minh họa</button>
          <button class="image-refresh-btn" onclick="refreshImage('${id}',event)" title="Đổi ngẫu nhiên">↻</button>
        </div>
        ${subTip}
        <div class="image-content expanded" id="${id}">${imgHTML}</div>
      </div>`;
    }

    window.toggleImage = id => {
      const d = document.getElementById(id);
      const btn = d.parentElement.querySelector('.image-toggle-btn');
      const expanded = d.classList.toggle('expanded');
      const mapContainer = d.parentElement.closest('.map-image-container');
      if (mapContainer) {
        const label = `${mapContainer.dataset.mapWorld||''} · ${mapContainer.dataset.mapPlace||''}`.trim();
        btn.textContent = expanded ? label : `Xem: ${label}`;
      } else {
        btn.textContent = expanded ? 'Thu gọn' : 'Xem minh họa';
      }
    };
    window.refreshImage = (id,e) => {
      const img = document.getElementById(id).querySelector('img');
      if(!img) return;
      const btn = e?.target?.closest('.image-refresh-btn');
      if (btn) { btn.style.transform='rotate(360deg)'; setTimeout(()=>btn.style.transform='',500); }
      img.style.opacity = '0.4';
      img.style.transition = 'opacity 0.3s ease';
      const _updateTip=(container,text)=>{
        if(!container) return;
        let tip=container.querySelector('.image-sub-tip');
        if(!tip){ tip=document.createElement('div'); tip.className='image-sub-tip'; container.querySelector('.image-content').before(tip); }
        tip.textContent=text;
      };
      try{
        const parts = img.src.split('/');
        const idx = _findCgIndex(parts);
        if(idx<0||idx+2>=parts.length){ img.style.opacity='1'; return; }
        const cat = parts[idx]; let char = _assetAlias(safeDecode(parts[idx+1]));
        parts[idx+1]=encodeURIComponent(char);
        const rawFile = _assetAlias(safeDecode(parts[idx+2]));
        const fm = rawFile.match(/^(.+?)(\d+)$/);
        let type = _assetAlias(fm ? fm[1] : rawFile);
        const curNum = fm ? parseInt(fm[2]) : 0;
        const container=img.closest('.image-container');

        /* Trường hợp 1: không có nhân vật -> thay nhân vật */
        if(!_charExists(char)){
          const origChar=char;
          const subChar=_pickSubChar(char);
          parts[idx+1]=encodeURIComponent(subChar);
          char=subChar;
          let max=_cgLookup(char,type);
          if(!max){
            const origType=type;
            const subType=_pickSubType(cat,type);
            max=_cgLookup(char,subType)||1;
            type=subType;
            _updateTip(container,`"${origChar}" không có minh họa, cảnh "${origType}" không tồn tại, đã thay bằng "${_displayAssetName(subChar)} · ${_displayAssetName(subType)}"`);
          }else{
            _updateTip(container,`Nhân vật "${origChar}" không có minh họa, đã thay bằng "${_displayAssetName(subChar)} · ${_displayAssetName(type)}"`);
          }
          let newNum; if(max===1) newNum=1; else do{ newNum=Math.floor(Math.random()*max)+1; }while(newNum===curNum);
          parts[idx+2]=encodeURIComponent(type+newNum+'.webp');
          img.onload=()=>{img.style.opacity='1';}; img.onerror=()=>{img.style.opacity='1';};
          img.src=parts.join('/');
          return;
        }

        /* Trường hợp 2: có nhân vật nhưng không có cảnh -> thay cảnh */
        let max = _cgLookup(char,type);
        if(!max){
          const origType=type;
          const subType=_pickSubType(cat,type);
          max=_cgLookup(char,subType)||1;
          type=subType;
          _updateTip(container,`"${_displayAssetName(char)}" không có minh họa "${origType}", đã thay bằng "${_displayAssetName(subType)}"`);
        }

        let newNum;
        if(max===1) newNum=1;
        else do{ newNum=Math.floor(Math.random()*max)+1; }while(newNum===curNum);
        parts[idx+2] = encodeURIComponent(type+newNum+'.webp');
        img.onload = ()=>{ img.style.opacity='1'; };
        img.onerror = ()=>{ img.style.opacity='1'; };
        img.src = parts.join('/');
      }catch(err){ img.style.opacity='1'; }
    };

    function processAllImages() {
      document.getElementById('readingContent').querySelectorAll('img').forEach(img => {
        if (img.closest('.image-container') || img.closest('.char-avatar-wrap')) return;
        /* Bỏ qua <img> rỗng không có src do tag bản đồ còn sót */
        if (!img.getAttribute('src')) { img.remove(); return; }
        /* Bỏ qua ảnh bản đồ, phần này không thuộc luồng CG */
        const decodedSrc=safeDecode(img.getAttribute('src'));
        if (decodedSrc.includes('地图/')||decodedSrc.includes('Bản đồ/')||decodedSrc.includes('Ban do/')) return;
        const wrap = document.createElement('div');
        wrap.innerHTML = createInteractiveImageContainer(img.outerHTML);
        img.replaceWith(wrap.firstElementChild);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const sz = localStorage.getItem('sjjy-font-size');
      if (sz) { currentFontSize=parseFloat(sz); document.querySelector('.reading-content').style.fontSize=sz+'px'; }
      const th = localStorage.getItem('sjjy-theme');
      if (th) { document.body.setAttribute('data-theme',th); document.getElementById('themeBtn').textContent=th==='night'?'🌙':'☀️'; }
      processDialogue();
      processMapTags();
      processAllImages();
    });
  </script>
</body>
</html>
